name: _
publish_to: none
environment:
  sdk: ^3.9.0
workspace:
  - packages/dex
  - packages/elf
  - packages/macho
  - packages/redis_client
  - packages/scoped_deps
  - packages/shorebird_build_trace
  - packages/shorebird_ci
  - packages/shorebird_cli
  - packages/shorebird_code_push_client
  - packages/shorebird_code_push_protocol
  - packages/verify_cache

dev_dependencies:
  very_good_analysis: ^11.0.0

# Repository-wide inputs to `shorebird_ci generate`. Declared here rather
# than passed as flags so `shorebird_ci verify` can rebuild the workflows
# in .github/workflows and tell a hand edit from what generation writes.
shorebird_ci:
  required: true
  fatal_infos: true
