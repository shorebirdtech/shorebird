name: e2e

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-e2e
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      cli_ref:
        description: >-
          Ref the cli job checks out, for verifying a fix before it lands.
          Defaults to each matrix branch. Setting it skips the patch matrix
          and pins the cli job to the dev API, so a dispatch never writes to
          production.
        required: false
        type: string
  schedule:
    # At the end of every day
    - cron: "0 0 * * *"

env:
  # SHOREBIRD_TOKEN is set per job, next to the SHOREBIRD_HOSTED_URL it has to
  # match. An API key is a row in one environment's database, so unlike the
  # Google-refresh-token format it replaced it does not authenticate against
  # both. A single workflow-level token would silently 401 half the matrix.
  #
  # Host toolchain for `dart test integration_test`, not the version under test.
  # Must ship a Dart new enough for the SDK constraints in the root pubspec.
  FLUTTER_VERSION: 3.47.1

jobs:
  patch:
    # A cli_ref dispatch is verifying the cli job; the patch matrix is dozens of
    # unrelated jobs that would only burn runner time.
    if: ${{ !inputs.cli_ref }}
    strategy:
      fail-fast: false
      matrix:
        flutter-version:
          [
            3.41.2,
            3.38.9,
            3.35.5,
            3.35.4,
            3.35.3,
            3.35.2,
            3.32.8,
            3.32.7,
            3.32.6,
            3.32.5,
            3.32.4,
            3.32.3,
            3.32.2,
            3.32.1,
            3.32.0,
            3.29.3,
            3.29.2,
            3.29.1,
            3.29.0,
            3.27.2,
            3.27.1,
            3.27.0,
            3.24.5,
            3.24.4,
            3.24.3,
            3.24.1,
            3.24.0,
            3.22.3,
            3.22.2,
            3.19.6,
          ]

    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SHOREBIRD_HOSTED_URL: https://api-dev.shorebird.dev
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN_DEV }}

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🖥️ Add Shorebird to PATH
        shell: bash
        run: echo "${GITHUB_WORKSPACE}/bin/" >> $GITHUB_PATH

      - name: 🐦 Verify Shorebird Installation
        run: |
          if [[ $(shorebird --version) =~ "Engine • revision" ]]; then          
            echo '✅ Shorebird CLI is installed!'
          else
            echo '❌ Shorebird CLI is not installed.'
          exit 1
          fi
        shell: bash

      - name: ☕ Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🎯 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version }}
          cache: true

      - name: 🚀 Enable KVM for Linux Runners
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 🤖 AVD Cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-29-${{ runner.os }}-${{ hashFiles('.github/workflows/e2e.yaml') }}

      - name: 🤖 Cache AVD Snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          force-avd-creation: false
          sdcard-path-or-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: false
          channel: canary
          script: echo "Generated AVD Snapshot"

      - name: 🧪 Run Patch E2E Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          script: ./scripts/patch_e2e.sh ${{ matrix.flutter-version }}

  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        # branch selects the API host as well as the ref, so a cli_ref dispatch
        # drops the stable leg rather than pointing unreleased code at prod.
        branch: ${{ inputs.cli_ref && fromJSON('["main"]') || fromJSON('["stable", "main"]') }}

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    env:
      SHOREBIRD_HOSTED_URL: ${{ matrix.branch == 'stable' && 'https://api.shorebird.dev' || 'https://api-dev.shorebird.dev' }}
      SHOREBIRD_TOKEN: ${{ matrix.branch == 'stable' && secrets.SHOREBIRD_TOKEN_PROD || secrets.SHOREBIRD_TOKEN_DEV }}

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.cli_ref || matrix.branch }}

      - name: 🖥️ Add Shorebird to macOS/Linux PATH
        shell: bash
        if: runner.os != 'Windows'
        run: echo "${GITHUB_WORKSPACE}/bin/" >> $GITHUB_PATH

      - name: 🖥️ Add Shorebird to Windows PATH
        shell: pwsh
        if: runner.os == 'Windows'
        run: Add-Content $env:GITHUB_PATH "${env:GITHUB_WORKSPACE}\bin"

      - name: 🐦 Verify Shorebird Installation (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          if [[ $(shorebird --version) =~ "Engine • revision" ]]; then          
            echo '✅ Shorebird CLI is installed!'
          else
            echo '❌ Shorebird CLI is not installed.'
          exit 1
          fi
        shell: bash

      - name: 🐦 Verify Shorebird Installation (Windows)
        if: runner.os == 'Windows'
        run: |
          $shorebird_version = shorebird --version
          if ($shorebird_version -match "Engine") {
            Write-Output "✅ Shorebird CLI is installed!"
          } else {
            Write-Output "❌ Shorebird CLI is not installed."
            exit 1
          }
        shell: pwsh

      - name: ☕ Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🎯 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 🧪 Run Integration Tests
        run: dart test integration_test
        working-directory: packages/shorebird_cli
