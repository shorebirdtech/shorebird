# Generated by shorebird_ci --style static. Safe to edit.
# Reusable workflow: CI steps for a single Flutter package.
on:
  workflow_call:
    inputs:
      package_name:
        required: true
        type: string
      package_path:
        required: true
        type: string
      flutter_version:
        required: false
        default: ""
        type: string
      has_integration_tests:
        required: false
        default: false
        type: boolean
      has_unit_tests:
        required: false
        default: true
        type: boolean
      subpackages:
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ inputs.flutter_version || '' }}
          channel: ${{ inputs.flutter_version && '' || 'stable' }}
      - name: Install Dependencies
        working-directory: ${{ inputs.package_path }}
        run: |
          flutter pub get --no-example
          for sub in ${{ inputs.subpackages }}; do
            flutter pub get --no-example -C $sub
          done
      - working-directory: ${{ inputs.package_path }}
        run: dart format --set-exit-if-changed .
      - working-directory: ${{ inputs.package_path }}
        run: flutter analyze .
      - if: inputs.has_unit_tests
        working-directory: ${{ inputs.package_path }}
        run: flutter test
      - name: Integration Tests
        if: inputs.has_integration_tests
        working-directory: ${{ inputs.package_path }}
        run: flutter test integration_test
