# Generated by shorebird_ci --style static. Safe to edit.
# Reusable workflow: CI steps for a single Dart package.
on:
  workflow_call:
    inputs:
      package_name:
        required: true
        type: string
      package_path:
        required: true
        type: string
      has_unit_tests:
        required: false
        default: true
        type: boolean
      subpackages:
        required: false
        default: ""
        type: string
      needs_redis:
        required: false
        default: false
        type: boolean
      runners:
        required: false
        # A JSON array: workflow_call has no list input type, and a
        # matrix needs one. shorebird_ci's generator still emits a bare
        # `runs-on: ubuntu-latest`; keep this if the file is regenerated.
        default: '["ubuntu-latest"]'
        type: string

jobs:
  ci:
    strategy:
      matrix:
        os: ${{ fromJSON(inputs.runners) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Windows runners default to pwsh, which cannot read the bash
        # loops and tests below.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: 🐳 Run Redis
        if: inputs.needs_redis
        run: |
          docker pull redis/redis-stack-server:latest
          docker run --name test_redis -d -p 6379:6379 --rm -e REDIS_ARGS="--requirepass password" redis/redis-stack-server:latest
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - name: Install Dependencies
        working-directory: ${{ inputs.package_path }}
        run: |
          dart pub get --no-example
          for sub in ${{ inputs.subpackages }}; do
            dart pub get --no-example -C $sub
          done
      - working-directory: ${{ inputs.package_path }}
        run: dart format --set-exit-if-changed .
      - working-directory: ${{ inputs.package_path }}
        run: dart analyze --fatal-warnings .
      - name: Run Tests
        if: inputs.has_unit_tests
        working-directory: ${{ inputs.package_path }}
        # Pinned until https://github.com/dart-lang/tools/issues/2667 is fixed.
        # `dart test` keeps every suite's compiled kernel file in the temp
        # dir until it exits, so one run over a package with ~200 test files
        # fills the runner's disk ("Disk quota exceeded"). Running the files
        # 50 at a time frees that dir between runs (#4262). Each suite
        # writes its own coverage file.
        # shorebird_ci's generator still emits a single `dart test`; keep
        # this batching if the file is regenerated.
        run: |
          dart pub global activate coverage 1.15.1
          # BSD xargs has no -r, so guard the empty case instead.
          files=$(find test -name '*_test.dart' | sort)
          [ -z "$files" ] || printf '%s\n' "$files" | xargs -n 50 dart test --coverage=coverage
          dart pub global run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --report-on=lib --check-ignore
      - if: inputs.has_unit_tests
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          flags: ${{ inputs.package_name }}
          working-directory: ${{ inputs.package_path }}
