# Generated by shorebird_ci --style static. Safe to edit.
# Run `shorebird_ci verify` to check for dep graph drift.
name: Shorebird CI

# A new push to a PR cancels that PR's run still going on the older head.
# Other events (push to main, merge_group) group by run id, so they never
# cancel or queue behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
  # Checks run on the queue's own temp branch, not the PR. Without this
  # trigger the required contexts never report there and the queue
  # ejects every PR at the timeout.
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # dorny/paths-filter lists a pull request's changed files through the API.
      pull-requests: read
    outputs:
      dex: ${{ steps.filter.outputs.dex }}
      elf: ${{ steps.filter.outputs.elf }}
      macho: ${{ steps.filter.outputs.macho }}
      scoped_deps: ${{ steps.filter.outputs.scoped_deps }}
      shorebird_build_trace: ${{ steps.filter.outputs.shorebird_build_trace }}
      shorebird_ci: ${{ steps.filter.outputs.shorebird_ci }}
      shorebird_cli: ${{ steps.filter.outputs.shorebird_cli }}
      shorebird_code_push_client: ${{ steps.filter.outputs.shorebird_code_push_client }}
      shorebird_code_push_protocol: ${{ steps.filter.outputs.shorebird_code_push_protocol }}
      shorebird_redis_client: ${{ steps.filter.outputs.shorebird_redis_client }}
      verify_cache: ${{ steps.filter.outputs.verify_cache }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so dorny/paths-filter can diff on push events.
          fetch-depth: 0
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - run: dart pub global activate shorebird_ci 0.3.0
      - name: Verify CI coverage
        run: shorebird_ci verify
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ github.event.merge_group.base_ref || '' }}
          filters: |
            dex:
              - .github/workflows/shorebird_ci.yaml
              - .github/workflows/_shorebird_ci_dart.yaml
              - packages/dex/**
              - pubspec.lock
              - pubspec.yaml
            elf:
              - .github/workflows/shorebird_ci.yaml
              - .github/workflows/_shorebird_ci_dart.yaml
              - packages/elf/**
              - pubspec.lock
              - pubspec.yaml
            macho:
              - .github/workflows/shorebird_ci.yaml
              - .github/workflows/_shorebird_ci_dart.yaml
              - packages/macho/**
              - pubspec.lock
              - pubspec.yaml
            scoped_deps:
              - .github/workflows/shorebird_ci.yaml
              - .github/workflows/_shorebird_ci_dart.yaml
              - packages/scoped_deps/**
              - pubspec.lock
              - pubspec.yaml
            shorebird_build_trace:
              - .github/workflows/shorebird_ci.yaml
              - .github/workflows/_shorebird_ci_dart.yaml
              - packages/shorebird_build_trace/**
              - pubspec.lock
              - pubspec.yaml
            shorebird_ci:
              - .github/workflows/shorebird_ci.yaml
              - .github/workflows/_shorebird_ci_dart.yaml
              - packages/shorebird_ci/**
              - pubspec.lock
              - pubspec.yaml
            shorebird_cli:
              - .github/workflows/shorebird_ci.yaml
              - .github/workflows/_shorebird_ci_dart.yaml
              - packages/dex/**
              - packages/scoped_deps/**
              - packages/shorebird_build_trace/**
              - packages/shorebird_cli/**
              - packages/shorebird_code_push_client/**
              - packages/shorebird_code_push_protocol/**
              - pubspec.lock
              - pubspec.yaml
            shorebird_code_push_client:
              - .github/workflows/shorebird_ci.yaml
              - .github/workflows/_shorebird_ci_dart.yaml
              - packages/shorebird_code_push_client/**
              - packages/shorebird_code_push_protocol/**
              - pubspec.lock
              - pubspec.yaml
            shorebird_code_push_protocol:
              - .github/workflows/shorebird_ci.yaml
              - .github/workflows/_shorebird_ci_dart.yaml
              - packages/shorebird_code_push_protocol/**
              - pubspec.lock
              - pubspec.yaml
            shorebird_redis_client:
              - .github/workflows/shorebird_ci.yaml
              - .github/workflows/_shorebird_ci_dart.yaml
              - packages/redis_client/**
              - pubspec.lock
              - pubspec.yaml
            verify_cache:
              - .github/workflows/shorebird_ci.yaml
              - .github/workflows/_shorebird_ci_dart.yaml
              - packages/verify_cache/**
              - pubspec.lock
              - pubspec.yaml

  dex:
    needs: changes
    if: needs.changes.outputs.dex == 'true'
    uses: ./.github/workflows/_shorebird_ci_dart.yaml
    with:
      package_name: dex
      package_path: packages/dex
      has_unit_tests: true
      subpackages: ""

  elf:
    needs: changes
    if: needs.changes.outputs.elf == 'true'
    uses: ./.github/workflows/_shorebird_ci_dart.yaml
    with:
      package_name: elf
      package_path: packages/elf
      has_unit_tests: true
      subpackages: ""
      min_coverage: "100"

  macho:
    needs: changes
    if: needs.changes.outputs.macho == 'true'
    uses: ./.github/workflows/_shorebird_ci_dart.yaml
    with:
      package_name: macho
      package_path: packages/macho
      has_unit_tests: true
      subpackages: ""
      min_coverage: "100"

  scoped_deps:
    needs: changes
    if: needs.changes.outputs.scoped_deps == 'true'
    uses: ./.github/workflows/_shorebird_ci_dart.yaml
    with:
      package_name: scoped_deps
      package_path: packages/scoped_deps
      has_unit_tests: true
      subpackages: ""
      runners: '["macos-latest", "windows-latest", "ubuntu-latest"]'
      min_coverage: "100"

  shorebird_build_trace:
    needs: changes
    if: needs.changes.outputs.shorebird_build_trace == 'true'
    uses: ./.github/workflows/_shorebird_ci_dart.yaml
    with:
      package_name: shorebird_build_trace
      package_path: packages/shorebird_build_trace
      has_unit_tests: true
      subpackages: ""

  shorebird_ci:
    needs: changes
    if: needs.changes.outputs.shorebird_ci == 'true'
    uses: ./.github/workflows/_shorebird_ci_dart.yaml
    with:
      package_name: shorebird_ci
      package_path: packages/shorebird_ci
      has_unit_tests: true
      subpackages: ""
      runners: '["macos-latest", "windows-latest", "ubuntu-latest"]'
      min_coverage: "99.7"

  shorebird_cli:
    needs: changes
    if: needs.changes.outputs.shorebird_cli == 'true'
    uses: ./.github/workflows/_shorebird_ci_dart.yaml
    with:
      package_name: shorebird_cli
      package_path: packages/shorebird_cli
      has_unit_tests: true
      subpackages: ""
      runners: '["macos-latest", "windows-latest", "ubuntu-latest"]'
      min_coverage: "94.7"

  shorebird_code_push_client:
    needs: changes
    if: needs.changes.outputs.shorebird_code_push_client == 'true'
    uses: ./.github/workflows/_shorebird_ci_dart.yaml
    with:
      package_name: shorebird_code_push_client
      package_path: packages/shorebird_code_push_client
      has_unit_tests: true
      subpackages: ""
      runners: '["macos-latest", "windows-latest", "ubuntu-latest"]'
      min_coverage: "99.4"

  shorebird_code_push_protocol:
    needs: changes
    if: needs.changes.outputs.shorebird_code_push_protocol == 'true'
    uses: ./.github/workflows/_shorebird_ci_dart.yaml
    with:
      package_name: shorebird_code_push_protocol
      package_path: packages/shorebird_code_push_protocol
      has_unit_tests: true
      subpackages: ""
      runners: '["macos-latest", "windows-latest", "ubuntu-latest"]'
      min_coverage: "97.6"

  shorebird_redis_client:
    needs: changes
    if: needs.changes.outputs.shorebird_redis_client == 'true'
    uses: ./.github/workflows/_shorebird_ci_dart.yaml
    with:
      package_name: shorebird_redis_client
      package_path: packages/redis_client
      has_unit_tests: true
      subpackages: ""
      needs_redis: true
      min_coverage: "98.0"

  verify_cache:
    needs: changes
    if: needs.changes.outputs.verify_cache == 'true'
    uses: ./.github/workflows/_shorebird_ci_dart.yaml
    with:
      package_name: verify_cache
      package_path: packages/verify_cache
      has_unit_tests: true
      subpackages: ""

  cspell:
    name: CSpell
    runs-on: ubuntu-latest
    # npx installs cspell's dependencies unpinned, so the job gets a
    # read-only token and checkout doesn't leave it in .git/config.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npx --yes cspell@10.4.0 --config cspell.config.yaml --no-progress "**"

  required:
    name: required
    if: ${{ !cancelled() }}
    needs:
      - changes
      - dex
      - elf
      - macho
      - scoped_deps
      - shorebird_build_trace
      - shorebird_ci
      - shorebird_cli
      - shorebird_code_push_client
      - shorebird_code_push_protocol
      - shorebird_redis_client
      - verify_cache
      - cspell
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed or were cancelled."
            exit 1
          fi
          echo "All required jobs passed (or were skipped because nothing changed)."

