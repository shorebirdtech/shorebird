# cspell:words connrefused
name: publish_cli

# Builds the CLI with `dart compile exe` for each platform we support and, for
# each commit pushed to stable (every release commit is one), uploads it to
#   gs://download.shorebird.dev/shorebird-cli/<commit sha>/shorebird-<os>-<arch>.zip
# with a .sha256 next to each zip. bin/shorebird can then download a ~5.5 MB
# CLI for a release commit instead of cloning the pinned Flutter and
# compiling the CLI with its Dart SDK (design:
# https://app.notion.com/p/421f369b53c9819489d7fbae2aeacb0d, section 1).
#
# The build uses the pinned Flutter's Dart SDK, the one today's bootstrap
# compiles the CLI with, so a prebuilt CLI behaves as a bootstrapped one.
# `dart compile exe` can't cross-compile to macOS or Windows, so each platform
# builds on its own runner.
#
# A pull request that changes this workflow, the bootstrap or the dependencies
# (what can break `dart compile exe` while analyze and tests still pass) builds
# and checks every binary, and that the bootstrap installs it, but uploads
# nothing. Only a push to stable (or a dispatch on stable) uploads, and
# only once all five built and passed their checks, so a commit has all its binaries or none (bin/shorebird
# falls back to today's bootstrap when its platform's binary is missing).

# stable, not v* tags: only the release app or an admin can move stable, and
# its head is the commit users upgrade to, while anyone with write access can
# push a tag. The publish identity trusts only stable's ref.
on:
  push:
    branches:
      - stable
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/publish_cli.yaml
      - bin/**
      - third_party/flutter/bin/**
      - pubspec.lock
      - "**/pubspec.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: 🔨 ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-latest
          - platform: macos-x64
            runner: macos-15-intel
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: windows-x64
            runner: windows-latest

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pinned Flutter (and so its Dart SDK) the way customers'
      # machines do, and resolves the workspace with --enforce-lockfile.
      - name: 🐦 Bootstrap (POSIX)
        if: runner.os != 'Windows'
        run: bin/shorebird --version

      - name: 🐦 Bootstrap (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./bin/shorebird.ps1 --version

      # The CLI finds its install from its own path (shorebird_env.dart's
      # shorebirdRoot assumes $ROOT/bin/cache/<executable>), so the binary is
      # built into and checked from bin/cache.
      - name: 🔨 Compile
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          flutter_version="$(cat bin/internal/flutter.version)"
          dart="bin/cache/flutter/$flutter_version/bin/cache/dart-sdk/bin/dart"
          exe=shorebird
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            dart="$dart.exe"
            exe=shorebird.exe
          fi
          "$dart" --version
          "$dart" compile exe packages/shorebird_cli/bin/shorebird.dart -o "bin/cache/$exe"
          echo "EXE=$exe" >> "$GITHUB_ENV"

      # A binary that can't start (built wrong, a missing library) would fail
      # every user on this platform at their first command. doctor exits 0
      # even when it finds issues, so it catches only a crash; --version and
      # `flutter versions list` are the checks that gate.
      - name: 🧪 Check the binary
        shell: bash
        run: |
          "bin/cache/$EXE" --version
          "bin/cache/$EXE" doctor
          "bin/cache/$EXE" flutter versions list > /dev/null

      - name: 📦 Zip
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p dist
          zip_name="shorebird-$PLATFORM.zip"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            pwsh -NoProfile -Command "Compress-Archive -Path bin/cache/$EXE -DestinationPath dist/$zip_name"
          else
            # -j stores the file at the zip's root; zip keeps the exec bit.
            zip -j "dist/$zip_name" "bin/cache/$EXE"
          fi
          # "<hash>  <name>" on every OS: Git Bash's sha256sum on Windows
          # would write "<hash> *<name>".
          hash="$(sha256sum "dist/$zip_name" | cut -d' ' -f1)"
          echo "$hash  $zip_name" > "dist/$zip_name.sha256"
          ls -l dist
          cat "dist/$zip_name.sha256"

      # bin/shorebird and shorebird.ps1 install a commit's zip when it has one.
      # Serve this one as download.shorebird.dev would and check the bootstrap
      # installs it and runs it, rather than building the snapshot.
      - name: 🧪 Bootstrap installs the binary
        shell: bash
        run: |
          sha="$(git rev-parse HEAD)"
          mkdir -p "served/shorebird-cli/$sha"
          cp dist/* "served/shorebird-cli/$sha/"
          python=python3
          if [[ "$RUNNER_OS" == "Windows" ]]; then python=python; fi
          "$python" -m http.server 8765 --bind 127.0.0.1 --directory served > /dev/null 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          curl --silent --retry 10 --retry-connrefused --retry-delay 1 --output /dev/null http://127.0.0.1:8765/
          export SHOREBIRD_DOWNLOAD_URL=http://127.0.0.1:8765

          rm -f bin/cache/shorebird.stamp "bin/cache/$EXE"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            pwsh -NoProfile -File bin/shorebird.ps1 --version
          else
            bin/shorebird --version
          fi
          test -x "bin/cache/$EXE"
          test "$(tr -d '\r\n' < bin/cache/shorebird-cli.stamp)" == "$sha"
          test ! -e bin/cache/shorebird.stamp
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # shorebird.bat picks the binary by its stamp.
            cmd.exe //c 'bin\shorebird.bat --version' | tee out.txt
            grep -q '^Shorebird [0-9]' out.txt
          fi

      - name: ⬆️ Keep the zip for the upload job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shorebird-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  upload:
    name: ☁️ Upload to download.shorebird.dev
    needs: build
    if: github.ref == 'refs/heads/stable' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: ⬇️ Download the zips
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shorebird-*
          path: dist
          merge-multiple: true

      - name: 🔍 Check all five are here
        run: |
          ls -l dist
          for platform in macos-arm64 macos-x64 linux-x64 linux-arm64 windows-x64; do
            test -s "dist/shorebird-$platform.zip"
            test -s "dist/shorebird-$platform.zip.sha256"
          done
          (cd dist && sha256sum -c ./*.sha256)

      # Keyless: the provider admits only shorebirdtech/shorebird's stable, and
      # the service account can only create objects under
      # download.shorebird.dev/shorebird-cli/, never overwrite them
      # (_shorebird#6373, infra/tofu/envs/prod).
      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/523302233293/locations/global/workloadIdentityPools/github-actions/providers/github-shorebird
          service_account: shorebird-cli-publish@code-push-prod.iam.gserviceaccount.com

      - name: ☁️ Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # The path is keyed by the commit, whose contents never change, so the
      # objects are cached as immutable. --no-clobber, since the identity can't
      # overwrite: a re-run skips what an earlier run uploaded and adds only
      # what's missing.
      - name: ☁️ Upload
        env:
          SHA: ${{ github.sha }}
        run: |
          # Zips first, checksums second, so a client never finds a .sha256
          # whose zip isn't there yet.
          dest="gs://download.shorebird.dev/shorebird-cli/$SHA/"
          gcloud storage cp --no-clobber dist/*.zip "$dest" \
            --cache-control="public, max-age=31536000, immutable"
          gcloud storage cp --no-clobber dist/*.sha256 "$dest" \
            --cache-control="public, max-age=31536000, immutable"
          gcloud storage ls -l "$dest"
