name: tmp apt cache test
on:
  push:
    branches: [eseidel/e2e-apt-cache]
jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux_build_deps
      - run: ls ~/apt-archives | wc -l; du -sh ~/apt-archives; which clang cmake ninja pkg-config xvfb-run; pkg-config --modversion gtk+-3.0
