name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  # Checks run on the queue's own temp branch, not the PR. Without this
  # trigger the required contexts never report there and the queue
  # ejects every PR at the timeout.
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  license_check:
    name: 📄 License Check
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 👀 Check Licenses
        uses: ./.github/actions/license_check
        with:
          working_directory: ${{ github.workspace }}

  actionlint:
    name: 🔍 Lint Workflows
    runs-on: ubuntu-latest
    # The image pull from Docker Hub is the only network step; bound it so a
    # Docker Hub stall fails fast instead of holding the required check.
    timeout-minutes: 5
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Catches a workflow GitHub would refuse to start (it fails such a
      # workflow's runs with no jobs and no error on the PR), plus shellcheck
      # over every run: script. The image bundles shellcheck; config is in
      # .github/actionlint.yaml.
      - name: 🔍 Run actionlint
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/repo" --workdir /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color # 1.7.12

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # dorny/paths-filter lists a pull request's changed files through the API.
      pull-requests: read

    outputs:
      needs_cross_platform_dart_build: ${{ steps.needs_cross_platform_dart_build.outputs.changes }}
      needs_redis_build: ${{ steps.needs_redis_build.outputs.changes }}
      needs_verify: ${{ steps.needs_verify.outputs.changes }}

    name: 👀 Detect Changes

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        name: Build Detection
        id: needs_cross_platform_dart_build
        with:
          filters: |
            shorebird_cli:
              - ./.github/workflows/main.yaml
              - ./.github/actions/dart_package/action.yaml
              - packages/dex/**
              - packages/scoped_deps/**
              - packages/shorebird_build_trace/**
              - packages/shorebird_cli/**
              - packages/shorebird_code_push_client/**
              - packages/shorebird_code_push_protocol/**
              - pubspec.lock
              - pubspec.yaml
            shorebird_code_push_client:
              - ./.github/workflows/main.yaml
              - ./.github/actions/dart_package/action.yaml
              - packages/shorebird_code_push_client/**
              - packages/shorebird_code_push_protocol/**
              - pubspec.lock
              - pubspec.yaml
            shorebird_code_push_protocol:
              - ./.github/workflows/main.yaml
              - ./.github/actions/dart_package/action.yaml
              - packages/shorebird_code_push_protocol/**
              - pubspec.lock
              - pubspec.yaml
            scoped_deps:
              - ./.github/workflows/main.yaml
              - ./.github/actions/dart_package/action.yaml
              - packages/scoped_deps/**
              - pubspec.lock
              - pubspec.yaml
            shorebird_ci:
              - ./.github/workflows/main.yaml
              - ./.github/actions/dart_package/action.yaml
              - packages/shorebird_ci/**
              - pubspec.lock
              - pubspec.yaml

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        name: Redis Detection
        id: needs_redis_build
        with:
          filters: |
            redis_client:
              - ./.github/workflows/main.yaml
              - ./.github/actions/dart_package/action.yaml
              - packages/redis_client/**
              - pubspec.lock
              - pubspec.yaml

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        name: Verify Detection
        id: needs_verify
        with:
          filters: |
            shorebird_cli:
              - ./.github/workflows/main.yaml
              - ./.github/actions/verify_version/action.yaml
              - packages/shorebird_cli/**
            shorebird_code_push_client:
              - ./.github/workflows/main.yaml
              - ./.github/actions/verify_version/action.yaml
              - packages/shorebird_code_push_client/**

  build_cross_platform_dart_packages:
    needs: changes
    if: ${{ needs.changes.outputs.needs_cross_platform_dart_build != '[]' }}

    strategy:
      matrix:
        # Ubuntu only on pull requests; all three OSes on pushes to main and
        # in the merge queue. GitHub bills macOS at ~10x and Windows at ~2x
        # Linux, and from 2026-10-15 to 11-03 these legs cost ~$660 on PR
        # runs while catching no test failure ubuntu missed (691 runs). A
        # platform-only break now shows on main's push run instead.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["macos-latest", "windows-latest", "ubuntu-latest"]') }}
        package: ${{ fromJSON(needs.changes.outputs.needs_cross_platform_dart_build) }}

    runs-on: ${{ matrix.os }}

    name: 🎯 Build ${{ matrix.package }} (${{ matrix.os }})

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🎯 Build ${{ matrix.package }}
        uses: ./.github/actions/dart_package
        with:
          working_directory: packages/${{ matrix.package }}
          workspace_root: ${{ github.workspace }}
          # Checked on ubuntu, the one OS every run has (PRs run no other).
          # shorebird_cli's iOS and macOS tests run only on macOS, so its
          # Linux number is ~4 points below macOS's; the floor is Linux's.
          check_coverage: ${{ matrix.os == 'ubuntu-latest' }}
          # Each package's Linux line coverage, rounded down, as a
          # floor. Raise it as coverage rises; lower it only in a PR that says
          # why (deleting well-tested code lowers the percentage). A package
          # not listed needs 100.
          min_coverage: ${{ fromJSON('{"shorebird_cli":"98.7","shorebird_code_push_client":"99.4","shorebird_code_push_protocol":"97.6","shorebird_ci":"99.7"}')[matrix.package] || '100' }}

  build_redis:
    needs: changes
    if: ${{ needs.changes.outputs.needs_redis_build != '[]' }}

    strategy:
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.needs_redis_build) }}

    runs-on: ubuntu-latest

    name: 🎯 Build ${{ matrix.package }}

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🐳 Run Redis
        run: |
          docker pull redis/redis-stack-server:latest
          docker run --name test_redis -d -p 6379:6379 --rm -e REDIS_ARGS="--requirepass password" redis/redis-stack-server:latest

      - name: 🎯 Build ${{ matrix.package }}
        uses: ./.github/actions/dart_package
        with:
          working_directory: packages/${{ matrix.package }}
          workspace_root: ${{ github.workspace }}
          # Line coverage on 2026-11-03 (98.04%), rounded down, as a floor;
          # see the job above.
          min_coverage: "98.0"

  verify_packages:
    needs: changes
    if: ${{ needs.changes.outputs.needs_verify != '[]' }}

    strategy:
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.needs_verify) }}

    runs-on: ubuntu-latest

    name: 🔎 Verify ${{ matrix.package }}

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔎 Verify ${{ matrix.package }}
        uses: ./.github/actions/verify_version
        with:
          working_directory: packages/${{ matrix.package }}

  ci:
    needs:
      [
        actionlint,
        changes,
        license_check,
        build_cross_platform_dart_packages,
        build_redis,
        verify_packages,
      ]
    # Not always(): that keeps this job alive through a run cancellation,
    # so a superseded push would report ci red on the stale commit. A
    # skipped required check reports success, which is the right answer
    # for a run nothing is waiting on.
    if: ${{ !cancelled() }}

    runs-on: ubuntu-latest

    steps:
      - name: ⛔️ exit(1) on failure or cancellation
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
