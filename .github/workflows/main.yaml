# cspell:words cmdline sdkmanager dists

name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PRs only. A push run on main is the only place a commit's macOS and
  # Windows legs run, and Detect Changes diffs only against the previous
  # commit, so a cancelled main run would skip them for good.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
  # Checks run on the queue's own temp branch, not the PR. Without this
  # trigger the required contexts never report there and the queue
  # ejects every PR at the timeout.
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  license_check:
    name: 📄 License Check
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 👀 Check Licenses
        uses: $/.github/actions/license_check
        with:
          working_directory: ${{ github.workspace }}

  actionlint:
    name: 🔍 Lint Workflows
    runs-on: ubuntu-latest
    # The image pull from Docker Hub is the only network step; bound it so a
    # Docker Hub stall fails fast instead of holding the required check.
    timeout-minutes: 5
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Catches a workflow GitHub would refuse to start (it fails such a
      # workflow's runs with no jobs and no error on the PR), plus shellcheck
      # over every run: script. The image bundles shellcheck; config is in
      # .github/actionlint.yaml.
      - name: 🔍 Run actionlint
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/repo" --workdir /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color # 1.7.12

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # dorny/paths-filter lists a pull request's changed files through the API.
      pull-requests: read

    outputs:
      agent_scripts: ${{ steps.agent_scripts.outputs.tool }}
      prebuilt_cli: ${{ steps.prebuilt_cli.outputs.install }}
      needs_verify: ${{ steps.needs_verify.outputs.changes }}
      android_build_e2e: ${{ steps.android_build_e2e.outputs.android }}
      protocol_codegen: ${{ steps.protocol_codegen.outputs.protocol }}

    name: 👀 Detect Changes

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        name: Agent Scripts Detection
        id: agent_scripts
        with:
          filters: |
            tool:
              - ./.github/workflows/main.yaml
              - ./tool/**

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        name: Prebuilt CLI Install Detection
        id: prebuilt_cli
        with:
          filters: |
            install:
              - ./.github/workflows/main.yaml
              - ./bin/**
              - ./third_party/flutter/bin/**
              - ./tool/prebuilt_cli_test.sh
              - ./tool/prebuilt_cli.Tests.ps1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        name: Verify Detection
        id: needs_verify
        with:
          filters: |
            shorebird_cli:
              - ./.github/workflows/main.yaml
              - ./.github/actions/verify_version/action.yaml
              - packages/dex/**
              - packages/elf/**
              - packages/macho/**
              - packages/scoped_deps/**
              - packages/shorebird_build_trace/**
              - packages/shorebird_cli/**
              - packages/shorebird_code_push_client/**
              - packages/shorebird_code_push_protocol/**
              - pubspec.lock
              - pubspec.yaml
            shorebird_code_push_client:
              - ./.github/workflows/main.yaml
              - ./.github/actions/verify_version/action.yaml
              - packages/shorebird_code_push_client/**
              - packages/shorebird_code_push_protocol/**
              - pubspec.lock
              - pubspec.yaml

      # What a real `shorebird release android` and `patch android` run:
      # the CLI and the packages it builds from, the Flutter it pins, and
      # this job.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        name: Android Build E2E Detection
        id: android_build_e2e
        with:
          filters: |
            android:
              - ./.github/workflows/main.yaml
              - bin/**
              - scripts/patch_e2e.dart
              - scripts/e2e_helpers.dart
              - scripts/no_android_sdk_downloads.sh
              - packages/dex/**
              - packages/elf/**
              - packages/macho/**
              - packages/scoped_deps/**
              - packages/shorebird_build_trace/**
              - packages/shorebird_cli/bin/**
              - packages/shorebird_cli/lib/**
              - packages/shorebird_cli/pubspec.yaml
              - packages/shorebird_code_push_client/lib/**
              - packages/shorebird_code_push_protocol/lib/**
              - pubspec.lock
              - pubspec.yaml

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        name: Protocol Codegen Detection
        id: protocol_codegen
        with:
          filters: |
            protocol:
              - ./.github/workflows/main.yaml
              - packages/shorebird_code_push_protocol/**
              - pubspec.lock
              - pubspec.yaml

  # A real Android release and patch built by this PR's CLI against dev,
  # with no device: PR CI's unit tests mock the builds, so a `flutter build`
  # or Gradle invocation no Flutter accepts used to show first in the nightly
  # e2e (#4406's `--init-script`, red on 11-11 and 11-12). The nightly also
  # runs the app on an emulator and covers older Flutter versions.
  #
  # Signs in with OIDC as dev's Shorebird E2E (437) e2e account, whose trust
  # rule admits this file on refs/pull/*. GitHub gives a fork's PR no OIDC
  # token, so a fork's PR skips it, as do Dependabot's (the nightly covers
  # those).
  android_build_e2e:
    name: 🤖 Android Build E2E
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      needs.changes.outputs.android_build_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read
      id-token: write

    env:
      SHOREBIRD_HOSTED_URL: https://api-dev.shorebird.dev
      AUTH_SERVICE_URL: https://auth-dev.shorebird.dev
      SHOREBIRD_PROJECT_ID: 437

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🖥️ Add Shorebird to PATH
        run: echo "${GITHUB_WORKSPACE}/bin/" >> "$GITHUB_PATH"

      - name: 🐦 Install Shorebird
        run: shorebird --version

      - name: ☕ Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: "temurin"
          java-version: "17"

      # The packages the pinned Flutter's build downloads otherwise; see
      # e2e.yaml's patch job.
      - name: 🤖 Install Android SDK Packages
        timeout-minutes: 10
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"

      # e2e.yaml's android_signing cache (same app template and pinned
      # Flutter), saved on main. Restore only: a PR's own save is usable by
      # no other ref and fills the repo's 10 GB cache.
      - name: 🐘 Gradle Cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists/*/*/*
            !~/.gradle/wrapper/dists/*/*/*.zip
          key: gradle-${{ runner.os }}-signing-${{ hashFiles('bin/internal/flutter.version') }}

      - name: 🧪 Release and Patch Android
        # With the Dart of the Flutter the CLI pins, as e2e.yaml's patch job.
        run: ./scripts/no_android_sdk_downloads.sh "bin/cache/flutter/$(cat bin/internal/flutter.version)/bin/dart" scripts/patch_e2e.dart --no-device

  verify_packages:
    needs: changes
    if: ${{ needs.changes.outputs.needs_verify != '[]' }}

    strategy:
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.needs_verify) }}

    runs-on: ubuntu-latest

    name: 🔎 Verify ${{ matrix.package }}

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔎 Verify ${{ matrix.package }}
        uses: $/.github/actions/verify_version
        with:
          working_directory: packages/${{ matrix.package }}

  protocol_codegen:
    name: 🔄 Verify Protocol Codegen
    needs: changes
    if: ${{ needs.changes.outputs.protocol_codegen == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2

      - name: 📦 Install Dependencies
        run: dart pub get --no-example -C packages/shorebird_code_push_protocol

      - name: 🔄 Run Protocol Codegen
        run: dart run packages/shorebird_code_push_protocol/tool/gen.dart

      - name: 🔍 Check for Uncommitted Changes
        run: |
          status=$(git status --porcelain -- packages/shorebird_code_push_protocol)
          if [ -n "$status" ]; then
            echo "::error::packages/shorebird_code_push_protocol is out of date with openapi.yaml. Run: dart run packages/shorebird_code_push_protocol/tool/gen.dart"
            git status --short -- packages/shorebird_code_push_protocol
            git diff -- packages/shorebird_code_push_protocol
            exit 1
          fi

  agent_scripts_test:
    name: 🧪 Test Agent Scripts
    needs: changes
    if: ${{ needs.changes.outputs.agent_scripts == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧪 Run tool/agent_scripts_test.sh
        run: ./tool/agent_scripts_test.sh

  # How bin/shorebird and bin/shorebird.ps1 install the CLI publish_cli.yaml
  # built for a stable commit (#4529), against a local server holding a fake
  # one: that it installs, and falls back to building with nothing left behind.
  # publish_cli.yaml checks the real binary. Seconds, not a real install.
  prebuilt_cli_sh:
    name: 🧪 Prebuilt CLI Install (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.prebuilt_cli == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # GNU and BSD tools. The test hides sha256sum to run the shasum
        # branch on both.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧪 Run tool/prebuilt_cli_test.sh
        run: ./tool/prebuilt_cli_test.sh

  prebuilt_cli_ps1:
    name: 🧪 Prebuilt CLI Install (Windows)
    needs: changes
    if: ${{ needs.changes.outputs.prebuilt_cli == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pester 5, installed if the runner image's PowerShell lacks it.
      - name: 🧪 Run tool/prebuilt_cli.Tests.ps1 (PowerShell 7)
        shell: pwsh
        run: |
          if (!(Get-Module -ListAvailable Pester | Where-Object Version -ge '5.0')) {
            Install-Module Pester -MinimumVersion 5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          }
          Import-Module Pester -MinimumVersion 5.0
          $config = New-PesterConfiguration
          $config.Run.Path = 'tool/prebuilt_cli.Tests.ps1'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

      # shorebird.bat runs shorebird.ps1 with Windows PowerShell 5.1 when
      # PowerShell 7 isn't installed.
      - name: 🧪 Run tool/prebuilt_cli.Tests.ps1 (Windows PowerShell 5.1)
        shell: powershell
        run: |
          if (!(Get-Module -ListAvailable Pester | Where-Object Version -ge '5.0')) {
            Install-Module Pester -MinimumVersion 5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          }
          Import-Module Pester -MinimumVersion 5.0
          $config = New-PesterConfiguration
          $config.Run.Path = 'tool/prebuilt_cli.Tests.ps1'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  ci:
    needs: [actionlint, agent_scripts_test, android_build_e2e, changes, license_check, prebuilt_cli_ps1, prebuilt_cli_sh, protocol_codegen, verify_packages]
    # Not always(): that keeps this job alive through a run cancellation,
    # so a superseded push would report ci red on the stale commit. A
    # skipped required check reports success, which is the right answer
    # for a run nothing is waiting on.
    if: ${{ !cancelled() }}

    runs-on: ubuntu-latest

    steps:
      - name: ⛔️ exit(1) on failure or cancellation
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
