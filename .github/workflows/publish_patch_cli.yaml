# cspell:words taiki crt endswith pipefail msvc MSVC RUSTFLAGS
name: Publish patch CLI

# The `patch` CLI (packages Shorebird patches; the shorebird CLI downloads and
# runs it) is built from the updater's Rust workspace in shorebirdtech/flutter
# (engine/src/flutter/third_party/updater/patch) and released here, next to
# the CLI that uses it, on patch-v* tags. The fork never carries these tags:
# `git describe --match '*.*.*'` there (flutter_tools' version, the release
# tooling's base engine lookup) would pick them up. The release tooling
# mirrors each release's zips to the download bucket per engine.
#
# A manual run builds from `flutter_ref` and publishes nothing, and so does a
# pull request that changes this workflow: the ways to try a change without a
# release.
on:
  push:
    tags:
      - "patch-v*"
  pull_request:
    paths:
      - .github/workflows/publish_patch_cli.yaml
  workflow_dispatch:
    inputs:
      flutter_ref:
        description: shorebirdtech/flutter branch or commit to build from
        default: shorebird/dev

# Two pushes of one tag would race to fill one release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    name: 🔎 Resolve source
    outputs:
      flutter_sha: ${{ steps.resolve.outputs.flutter_sha }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      # One flutter commit for every job, so all four binaries come from the
      # same source even if the branch moves meanwhile. A tag whose release is
      # already published (patch-v0.3.0, copied over from the archived
      # shorebirdtech/updater) is left alone.
      - id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          FLUTTER_REF: ${{ inputs.flutter_ref || 'updater-import' }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ] &&
            [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
            echo "$TAG is already published; nothing to build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha=$(gh api "repos/shorebirdtech/flutter/commits/$FLUTTER_REF" --jq .sha)
          if ! gh api "repos/shorebirdtech/flutter/contents/engine/src/flutter/third_party/updater/patch/Cargo.toml?ref=$sha" > /dev/null; then
            echo "::error::shorebirdtech/flutter@$sha has no updater (engine/src/flutter/third_party/updater/patch)"
            exit 1
          fi
          echo "Building from shorebirdtech/flutter@$sha"
          echo "flutter_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}

    name: 🦀 Build ${{ matrix.target }}

    # Static CRT, so patch.exe runs without the VC++ redistributable. The
    # crate's patch/.cargo/config.toml says the same, but cargo reads config
    # from the directory it runs in, not the manifest's, so it never applied.
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static

    steps:
      # Read-only and without persisted credentials: crates.io build scripts
      # run in this job, so it holds no token that can write to this repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shorebirdtech/flutter
          ref: ${{ needs.resolve.outputs.flutter_sha }}
          path: flutter
          sparse-checkout: engine/src/flutter/third_party/updater
          persist-credentials: false
      - id: build
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: "patch"
          manifest-path: flutter/engine/src/flutter/third_party/updater/Cargo.toml
          target: ${{ matrix.target }}
          locked: true
          tar: none
          zip: all
          dry-run: true
          dry-run-intended: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.build.outputs.zip }}
          if-no-files-found: error

  publish:
    needs: [resolve, build]
    if: github.event_name == 'push' && needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    name: 🚀 Publish Release
    # The only job that can write here, and it runs no third-party code.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: zips
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          FLUTTER_SHA: ${{ needs.resolve.outputs.flutter_sha }}
        run: |
          set -euo pipefail
          count=$(ls zips/*.zip | wc -l)
          if [ "$count" != 4 ]; then
            echo "Expected 4 zips, found $count" >&2
            exit 1
          fi
          notes="The updater's patch CLI, built from shorebirdtech/flutter@$FLUTTER_SHA (engine/src/flutter/third_party/updater/patch)."
          # Never "latest": that's the CLI's release, which the release
          # tooling reads (releases/latest).
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" zips/*.zip --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$notes" \
              --draft=false --latest=false
          else
            gh release create "$TAG" zips/*.zip --repo "$GITHUB_REPOSITORY" \
              --verify-tag --latest=false --title "patch ${TAG#patch-v}" --notes "$notes"
          fi
