# cspell:words pipefail
name: Publish shorebird_code_push

# shorebird_code_push is a Flutter package outside the Dart workspace (it
# supports Dart 3.5), so it publishes with Flutter rather than through
# publish_dart_package.yaml.
on:
  push:
    tags:
      - "shorebird_code_push-v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  publish:
    name: 📦 Publish packages/shorebird_code_push
    runs-on: ubuntu-latest
    # pub.dev's automated publishing for this package names this environment
    # (as it did in shorebirdtech/updater), so only its repository changes.
    environment: pub.dev
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: packages/shorebird_code_push

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0

      - name: 🔎 Verify tag matches pubspec version
        run: |
          set -euo pipefail
          PUBSPEC_VERSION=$(awk '/^version:/ {print $2}' pubspec.yaml)
          TAG_VERSION="${GITHUB_REF_NAME#shorebird_code_push-v}"
          if [ "$PUBSPEC_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match pubspec version ($PUBSPEC_VERSION)"
            exit 1
          fi

      - name: 🪪 Get Id Token
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pub_token = await core.getIDToken('https://pub.dev')
            core.exportVariable('PUB_TOKEN', pub_token)

      - name: 📢 Authenticate
        run: flutter pub pub token add https://pub.dev --env-var PUB_TOKEN

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🧪 Test
        run: flutter test

      - name: 🌵 Dry Run
        run: flutter pub publish --dry-run

      - name: 🚀 Publish
        run: flutter pub publish --force
