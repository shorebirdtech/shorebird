# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
# Each ecosystem waits 5 days after a release before Dependabot opens its PR,
# so a broken or compromised version has time to be flagged and yanked first.
# Security updates skip the cooldown. Use `default-days` only: the
# semver-*-days keys aren't accepted for every ecosystem (github-actions
# rejects them), and one unsupported key makes Dependabot reject the whole file.
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      dart-deps:
        patterns:
          - "*"
  # shorebird_code_push isn't in the workspace: it supports Dart 3.5
  # (Flutter 3.24), older than pub workspaces allow.
  - package-ecosystem: "pub"
    directory: "/packages/shorebird_code_push"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      shorebird_code_push-deps:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      gh-deps:
        patterns:
          - "*"
