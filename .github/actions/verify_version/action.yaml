name: Verify Version Workflow
description: Verify the version of the package is correct

inputs:
  working_directory:
    required: false
    description: "The working directory to run the command in"
    default: "."

runs:
  using: "composite"

  steps:
    - name: 📚 Git Checkout
      uses: actions/checkout@v7

    - name: 🎯 Setup Dart
      uses: dart-lang/setup-dart@v1
      with:
        # Its matcher path resolves against the calling composite action rather
        # than setup-dart itself, so the file is never found. setup-dart#198.
        problem-matcher: false

    - name: 📦 Install Dependencies
      shell: ${{ inputs.shell }}
      run: dart pub get
      working-directory: ${{ inputs.working_directory }}

    - name: 🔎 Verify version
      shell: ${{ inputs.shell }}
      # Only the file with the version-verify test: naming no files makes
      # `dart test` compile every suite (to read its tags), each to its own
      # kernel file kept until exit, which can fill the runner's disk.
      run: dart run test --run-skipped -t version-verify test/ensure_build_test.dart
      working-directory: ${{ inputs.working_directory }}
