name: Dart Package Workflow
description: Build and test your Dart packages.

inputs:
  codecov_token:
    required: true
    description: The Codecov token used to upload coverage
  concurrency:
    required: false
    default: "4"
    description: The value of the concurrency flag (-j) used when running tests
  coverage_excludes:
    required: false
    default: ""
    description: Globs to exclude from coverage
  dart_sdk:
    required: false
    default: "stable"
    description: "The dart sdk version to use"
  working_directory:
    required: false
    default: "."
    description: The working directory for this workflow
  min_coverage:
    required: false
    default: "100"
    description: The minimum coverage percentage value
  analyze_directories:
    required: false
    default: "lib test"
    description: Directories to analyze
  report_on:
    required: false
    default: "lib"
    description: Directories to report on when collecting coverage
  platform:
    required: false
    default: "vm"
    description: Platform to use when running tests
  workspace_root:
    required: false
    default: "."
    description: The root of the project workspace (if using Dart workspaces)

runs:
  using: "composite"
  steps:
    - name: 🎯 Setup Dart
      uses: dart-lang/setup-dart@v1
      with:
        sdk: ${{inputs.dart_sdk}}
        # Its matcher path resolves against the calling composite action rather
        # than setup-dart itself, so the file is never found. setup-dart#198.
        problem-matcher: false

    - name: 📦 Install Dependencies
      working-directory: ${{ inputs.working_directory }}
      shell: ${{ inputs.shell }}
      run: dart pub get

    - name: ✨ Format
      working-directory: ${{ inputs.working_directory }}
      shell: ${{ inputs.shell }}
      run: dart format --set-exit-if-changed .

    - name: 🔍 Analyze
      working-directory: ${{ inputs.working_directory }}
      shell: ${{ inputs.shell }}
      run: dart analyze --fatal-warnings ${{inputs.analyze_directories}}

    - name: 🧪 Test
      working-directory: ${{ inputs.working_directory }}
      # bash on every OS, for find and xargs.
      shell: bash
      # Through env and quoted, so bash keeps a Windows path's backslashes.
      env:
        WORKSPACE_ROOT: ${{ inputs.workspace_root }}
      run: |
        # Pinned until https://github.com/dart-lang/tools/issues/2667 is fixed.
        dart pub global activate coverage 1.15.1
        # `dart test` keeps every suite's compiled kernel file in the temp
        # dir until it exits, so one run over shorebird_cli's ~200 test files
        # fills an ubuntu runner's disk ("Disk quota exceeded"). Running the
        # files 50 at a time frees that dir between runs (--total-shards
        # doesn't: every shard still compiles every suite). Each suite writes
        # its own coverage file, merged below. xargs exits non-zero if any
        # run fails.
        find test -name '*_test.dart' | sort | xargs -r -n 50 dart test -j ${{inputs.concurrency}} --coverage=coverage --platform=${{inputs.platform}}
        dart pub global run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --packages="$WORKSPACE_ROOT/.dart_tool/package_config.json" --report-on=${{inputs.report_on}} --check-ignore

    # Per https://stackoverflow.com/questions/73402042/github-action-expressions-split-string
    - name: 🔗 Split package name
      env:
        PACKAGE_PATH: ${{ inputs.working_directory}}
      id: split
      shell: ${{ inputs.shell }}
      run: echo "package_name=${PACKAGE_PATH##*/}" >> $GITHUB_OUTPUT

    - name: 📊 Upload Coverage
      uses: codecov/codecov-action@v7
      with:
        flags: ${{ steps.split.outputs.package_name }}
        token: ${{ inputs.codecov_token }}
