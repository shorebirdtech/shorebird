# Generated by shorebird_ci. Safe to edit.
# Run `shorebird_ci verify` to check for dep graph drift.
# shorebird_ci-managed: dynamic
name: Shorebird CI

# A new push to a PR cancels that PR's run still going on the older head.
# Other events (push to main, merge_group) group by run id, so they never
# cancel or queue behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
  # Checks run on the queue's own temp branch, not the PR. Without this
  # trigger the required contexts never report there and the queue
  # ejects every PR at the timeout.
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
  # Manual dispatch runs CI against all packages, bypassing the
  # affected-packages diff. Useful on the first push to a new repo (where
  # there's no diff base) or when you want to force a full re-check.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      dart_packages: ${{ steps.affected.outputs.dart_packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # affected_packages diffs against origin/main, which isn't in
          # the default shallow checkout. Full history is needed for the
          # diff to resolve.
          fetch-depth: 0
          persist-credentials: false
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
      - run: dart pub global activate shorebird_ci 0.3.4
      # Verify first so we fail fast if CI coverage is broken and
      # don't waste time computing affected packages.
      - name: Verify CI coverage
        run: shorebird_ci verify
      - id: affected
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "::notice::Manual dispatch: running CI against all packages."
            EXTRA_ARGS=--all
          else
            EXTRA_ARGS=
          fi
          DART=$(shorebird_ci affected_packages --sdk dart $EXTRA_ARGS)
          echo "dart_packages=$DART" >> $GITHUB_OUTPUT
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]] && [[ "$DART" == "[]" ]]; then
            echo "::notice::No affected packages in diff vs origin/main. Click 'Run workflow' in the Actions tab to run CI against all packages."
          fi

  dart_ci:
    needs: setup
    if: needs.setup.outputs.dart_packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.dart_packages) }}
    name: ${{ matrix.name }}
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
      - name: Install Dependencies
        env:
          SUBPACKAGES: ${{ matrix.subpackages }}
        run: |
          dart pub get --no-example
          for sub in $SUBPACKAGES; do
            dart pub get --no-example -C "$sub"
          done
      - run: dart format --set-exit-if-changed .
      - run: dart analyze --fatal-warnings .
      - run: dart test

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    # Lints the workflows in .github/workflows for GitHub Actions
    # security mistakes: https://docs.zizmor.sh/audits/
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH" in
            X64) asset=zizmor-x86_64-unknown-linux-gnu.tar.gz sha=3e6a301c7a820a2501915f5a9de8c0486da82bdec7965f068477538a98743d43 ;;
            ARM64) asset=zizmor-aarch64-unknown-linux-gnu.tar.gz sha=aa487c792a7cbbe86e4f8dccd3b66de33b3b51813c090aaa0842d7ea08a3fc35 ;;
            *) echo "::error::No zizmor release for Linux $RUNNER_ARCH"; exit 1 ;;
          esac
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/$asset" "https://github.com/zizmorcore/zizmor/releases/download/v1.33.1/$asset"
          echo "$sha  $RUNNER_TEMP/$asset" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zizmor"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/zizmor"
          echo "$RUNNER_TEMP/zizmor" >> "$GITHUB_PATH"
      - name: Lint workflows
        run: zizmor --offline .github/workflows
