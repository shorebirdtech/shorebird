# A copy of the public Shorebird CodePush API spec (the one served at
# https://api.shorebird.dev/openapi.yaml), or a subset of it. This package
# is generated from it by tool/gen.dart. The server's spec is the source
# of truth: the server's CI fails when this copy says anything the
# server's public spec doesn't. So a CLI change that needs a field or
# operation the server already serves adds it here and regenerates in the
# same PR, and when the server stops publishing something, it is removed
# here first.
#
# cspell:words httpapi rollfoward SIEM undercount
openapi: 3.1.0
info:
  title: Shorebird CodePush API
  version: 1.0.0
  description: |
    The Shorebird over-the-air code push API. Models and message DTOs
    originally lived in the handwritten `shorebird_code_push_protocol`
    and `shorebird_code_push_client` packages; this spec is the
    OpenAPI representation of that surface area.

    This surface is published so that it can be read and called directly,
    by people and by agents, rather than only through the Shorebird CLI.
    It does not yet carry a compatibility guarantee: it is the API the
    CLI and console use, and it changes when they do. Build on it, and
    expect to follow it.

    Authenticate with an `sb_api_*` API key from the Shorebird console
    (Account > API Keys). The `x-version` header some clients send
    identifies `shorebird_code_push_client` and is not part of this
    contract; omit it.

    Requests are rate limited per caller (per API key, or per client IP
    when unauthenticated). Every response carries `RateLimit-Policy` and
    `RateLimit` (draft-ietf-httpapi-ratelimit-headers), so a client can
    pace itself. A refused request is a `429` with `Retry-After` and the
    standard error envelope (`ErrorResponse`, code `rate_limited`); it is
    covered by each operation's `default` response rather than listed on
    every one.
  contact:
    name: Shorebird
    url: https://docs.shorebird.dev/
servers:
  - url: https://api.shorebird.dev/api/v1
security:
  - apiKey: []
  - oauthJwt: []
tags:
  - name: apps
    description: Applications and their metadata.
  - name: releases
    description: Release builds and their artifacts.
  - name: patches
    description: Over-the-air patches for releases.
  - name: channels
    description: Release channels.
  - name: collaborators
    description: App collaborators and their roles.
  - name: organizations
    description: Organizations and membership.
  - name: users
    description: Shorebird user accounts.
  - name: invitations
    description: Invitations sent to the signed-in user.
  - name: billing
    description: The plan an account is on, and its patch install usage against it.
  - name: diagnostics
    description: Infrastructure diagnostics endpoints.
  - name: metrics
    description: Customer-facing analytics charts (MAU v2).
  - name: app-store-connect
    description: |
      The App Store Connect team API key an organization gives Shorebird, so
      Shorebird can call App Store Connect for the organization's Apple team.
      The private key is stored encrypted and never returned.
  - name: service-accounts
    description: |
      Non-human accounts an organization owns for CI and other automation.
      A service account holds a role in its organization and authenticates
      either with API keys issued to it or, under an OIDC trust rule, with a
      token from its CI provider's own identity provider. It never signs in
      interactively.
paths:
  /users/me:
    get:
      tags:
        - users
      summary: Get the currently logged-in user.
      operationId: getCurrentUser
      responses:
        '200':
          description: The currently logged-in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateUser'
        '404':
          description: No user is currently logged in.
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags:
        - users
      summary: Update the signed-in user.
      description: |
        Changes the signed-in user's display name, patch overage limit, or
        both. A field left out of the body is left unchanged. Both fields
        are validated before either is written, so a request that is
        refused changes nothing; a request that fails partway (a `424`)
        may have saved the display name.

        Changing `patch_overage_limit` needs a signed-in session that is
        not narrowed to a subset of permissions: an API key is refused
        with a `403` (`personal_access_token_forbidden`), and a narrowed
        session with `api_key_insufficient_permissions`.
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '204':
          description: The user was updated.
        '400':
          description: |
            A field has the wrong type (`user_update_error`), the overage
            limit is negative (`user_update_overage_invalid`), or the
            display name is longer than 256 characters
            (`user_update_display_name_invalid`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: |
            An `Authorization` header was sent but its credential is
            invalid or expired (`user_get_unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            The overage limit cannot be changed: the credential is an API
            key (`personal_access_token_forbidden`) or a narrowed session
            (`api_key_insufficient_permissions`), the plan is a
            negotiated enterprise plan whose overage is set by the account
            team (`user_update_overage_negotiated`), or the plan is Hobby,
            on which only `0` is accepted
            (`shorebird_plan_insufficient_tier`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            No user is signed in (`user_get_user_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '424':
          description: |
            Reading the plan or writing the change failed
            (`user_update_error`), or enabling overage billing for an
            annual plan failed (`user_update_overage_provisioning_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
        - users
      summary: Delete the signed-in user's account.
      description: |
        Permanently deletes the signed-in user's account. Every
        organization the deletion would leave without members (the user's
        personal organization, and any organization the user is the only
        member of) is deleted with all of its apps, their releases,
        patches and stored artifacts. The user's other memberships are
        removed. This cannot be undone.

        An account with many apps is deleted over several requests: a
        `202` says how many apps are left, and the same request continues
        from there.

        Refused with a `409`, before anything is deleted, while the user
        owns a team organization (transfer or delete it first), owns a
        personal organization that has other members (remove them first),
        or has a Stripe subscription that can still bill (cancel it first).

        Needs a signed-in session that is not narrowed to a subset of
        permissions: an API key is refused with a `403`
        (`personal_access_token_forbidden`), and a narrowed session with
        `api_key_insufficient_permissions`.
      operationId: deleteCurrentUser
      responses:
        '202':
          description: |
            Part of the account was deleted, and the request stopped before
            its timeout with apps still to go. Make the same request again,
            until it answers `204`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteUserInProgressResponse'
        '204':
          description: The account was deleted.
        '401':
          description: |
            An `Authorization` header was sent but its credential is
            invalid or expired (`user_get_unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            The credential is an API key
            (`personal_access_token_forbidden`) or a narrowed session
            (`api_key_insufficient_permissions`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            No user is signed in (`user_get_user_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            The user owns a team organization
            (`user_delete_blocked_by_team_orgs`; the message names them) or
            has a subscription that can still bill
            (`user_delete_blocked_by_active_subscription`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '424':
          description: |
            Stripe, storage or the database failed (`user_delete_error`).
            Apps and organizations deleted before the failure stay
            deleted; retrying finishes the deletion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
  /users/me/notification_preferences:
    get:
      tags:
        - users
      summary: Get the signed-in user's notification preferences.
      description: |
        Service accounts are refused with a `403`
        (`service_account_forbidden`).
      operationId: getNotificationPreferences
      responses:
        '200':
          description: The user's notification preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetNotificationPreferencesResponse'
        '424':
          description: |
            The preferences could not be read
            (`user_get_notification_preferences_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags:
        - users
      summary: Update the signed-in user's notification preferences.
      description: |
        A preference left out of the body, or sent as `null`, is left
        unchanged. Service accounts are refused with a `403`
        (`service_account_forbidden`).
      operationId: updateNotificationPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationPreferencesRequest'
      responses:
        '204':
          description: The preferences were updated.
        '400':
          description: |
            The body is not valid JSON or a field has the wrong type
            (`user_patch_notification_preferences_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '424':
          description: |
            The preferences could not be saved
            (`user_patch_notification_preferences_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
  /invitations:
    get:
      tags:
        - invitations
      summary: List the pending invitations sent to the signed-in user.
      description: |
        Invitations to join an organization, or to collaborate on an app,
        sent to the signed-in user's email address, most recently sent
        first. The email matches without regard to case. Accepted,
        declined, revoked and expired invitations are left out. Service
        accounts have no email and are refused with a `403`.
      operationId: getReceivedInvitations
      parameters:
        - $ref: '#/components/parameters/PerPage'
          description: |
            The number of invitations per page. This list always pages:
            without `per_page` a page holds 30. Values above 100 are
            treated as 100; values that are not a positive integer are
            treated as 30.
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of the signed-in user's pending invitations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetReceivedInvitationsResponse'
        default:
          $ref: '#/components/responses/Error'
  /invitations/{invitationId}:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
    get:
      tags:
        - invitations
      summary: Get an invitation sent to the signed-in user.
      description: |
        The full invitation, including the invitee's and inviter's email
        addresses and the role it grants. Only the invited recipient (the
        signed-in user whose email matches, without regard to case) may
        read it. An unknown id, an id that is not a UUID, an invitation
        that is no longer pending, and an invitation sent to someone else
        are all answered with the same `404`, so this never confirms that
        an invitation exists to anyone but its recipient. Service accounts
        are refused with a `403` (`service_account_forbidden`).
      operationId: getInvitation
      responses:
        '200':
          description: The invitation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInvitationResponse'
        '404':
          description: |
            No pending invitation with this id was sent to the signed-in
            user (`invitation_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '424':
          description: The invitation could not be looked up (`invitation_lookup_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
  /invitations/{invitationId}/accept:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
    post:
      tags:
        - invitations
      summary: Accept an invitation sent to the signed-in user.
      description: |
        Adds the signed-in user to the organization or app with the
        invitation's role. Accepting an invitation to something the user
        already belongs to also succeeds.
      operationId: acceptInvitation
      responses:
        '204':
          description: The invitation was accepted.
        '403':
          description: The invitation was sent to a different email address.
        '404':
          description: No such invitation.
        '410':
          description: |
            The invitation was already accepted, declined, revoked, or has
            expired.
        default:
          $ref: '#/components/responses/Error'
  /invitations/{invitationId}/decline:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
    post:
      tags:
        - invitations
      summary: Decline an invitation sent to the signed-in user.
      operationId: declineInvitation
      responses:
        '204':
          description: The invitation was declined.
        '403':
          description: The invitation was sent to a different email address.
        '404':
          description: No such invitation.
        '410':
          description: |
            The invitation was already accepted, declined, revoked, or has
            expired.
        default:
          $ref: '#/components/responses/Error'
  /plan:
    get:
      tags:
        - billing
      summary: Get the signed-in user's plan.
      description: |
        The plan the signed-in user's own account is on, with that
        account's install credit and overage limit applied. Read from a
        cache that can trail a subscription change by a few minutes;
        `DELETE /users/me/plan-cache` drops it. Service accounts are
        refused with a `403` (`service_account_forbidden`).
      operationId: getPlan
      responses:
        '200':
          description: The user's plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '424':
          description: |
            The subscription could not be read from Stripe, or the account
            has more than one active subscription
            (`shorebird_plan_subscription_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
  /usage:
    get:
      tags:
        - billing
      summary: Get the signed-in user's patch install usage.
      description: |
        Patch installs this allotment period (the base subscription's
        current billing period) for every app in every organization the
        signed-in user owns, and where the account stands against its
        plan. Service accounts are refused with a `403`
        (`service_account_forbidden`).
      operationId: getUsage
      responses:
        '200':
          description: The user's usage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUsageResponse'
        '424':
          description: |
            Stripe, the database, or the install metrics could not be read
            (`organization_usage_get_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
  /apps:
    get:
      tags:
        - apps
      summary: List all apps for the current account.
      operationId: getApps
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A list of apps.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAppsResponse'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
        - apps
      summary: Create a new app.
      operationId: createApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppRequest'
      responses:
        '200':
          description: The newly-created app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        default:
          $ref: '#/components/responses/Error'
  /apps/{appId}:
    parameters:
      - $ref: '#/components/parameters/AppId'
    get:
      tags:
        - apps
      summary: Get the specified app.
      operationId: getApp
      responses:
        '200':
          description: The requested app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppMetadata'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
        - apps
      summary: Delete the specified app.
      operationId: deleteApp
      responses:
        '204':
          description: The app was deleted.
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags:
        - apps
      summary: Rename the app.
      description: |
        Sets the app's display name. Requires the `apps.update` permission.
      operationId: updateApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppRequest'
      responses:
        '204':
          description: The app was renamed.
        '400':
          description: |
            The body could not be parsed (`apps_patch_error`), or `name` is
            empty or longer than 256 characters
            (`apps_patch_invalid_display_name`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller lacks the `apps.update` permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The app does not exist (`app_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
  /apps/{appId}/signing-key:
    parameters:
      - $ref: '#/components/parameters/AppId'
    get:
      tags:
        - releases
      summary: Get the managed signing key a new release build of the app embeds.
      description: |
        Returns the managed patch-signing key a new release build of the
        app embeds: the app's own key if it has one, else its
        organization's current key. The organization's key is created on
        the first call, so repeated calls return the same key until it is
        rotated. The CLI calls this before it builds each platform of a
        release, embeds the public key, and reports the key's id with each
        release artifact it uploads. Requires permission to create the
        app's releases.
      operationId: getAppSigningKey
      responses:
        '200':
          description: The key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSigningKeyResponse'
        '503':
          description: Managed signing is not configured on this server.
        default:
          $ref: '#/components/responses/Error'
  /apps/{appId}/collaborators:
    parameters:
      - $ref: '#/components/parameters/AppId'
    post:
      tags:
        - collaborators
      summary: Add a collaborator to the app by email.
      operationId: createAppCollaborator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppCollaboratorRequest'
      responses:
        '204':
          description: The collaborator was added.
        default:
          $ref: '#/components/responses/Error'
    get:
      tags:
        - collaborators
      summary: List the app's collaborators.
      description: |
        Every user holding a per-app role on the app. Members of the
        organization that owns the app are not listed unless they also hold
        a per-app role; see `GET /organizations/{organizationId}/users`. The
        list is not paged.
      operationId: getAppCollaborators
      responses:
        '200':
          description: The app's collaborators.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppCollaborator'
        '403':
          description: The caller lacks the `appRoleGrants.view` permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The app does not exist (`app_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
  /apps/{appId}/collaborators/{collaboratorId}:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - name: collaboratorId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    patch:
      tags:
        - collaborators
      summary: Update a collaborator's role on an app.
      operationId: updateAppCollaborator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppCollaboratorRequest'
      responses:
        '204':
          description: The collaborator was updated.
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
        - collaborators
      summary: Remove a collaborator from the app.
      description: |
        Removes the per-app role held on the app by the user whose ID is
        `collaboratorId`. The app's owner cannot be removed. Requires the
        `appRoleGrants.delete` permission, and the plan of the app's
        billing account must include collaboration. Removing a user who
        holds no role on the app also succeeds.
      operationId: deleteAppCollaborator
      responses:
        '204':
          description: The collaborator was removed.
        '400':
          description: |
            `collaboratorId` is not an integer
            (`app_collaborators_delete_malformed_request`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            The caller lacks the `appRoleGrants.delete` permission, or the
            app's plan does not include collaboration
            (`shorebird_plan_insufficient_tier`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The app does not exist (`app_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          description: |
            `collaboratorId` is the app's owner, who cannot be removed
            (`app_collaborators_delete_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '424':
          description: |
            The app's owner could not be found
            (`shorebird_app_missing_owner`), or the removal failed
            (`app_collaborators_delete_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
  /apps/{appId}/channels:
    parameters:
      - $ref: '#/components/parameters/AppId'
    get:
      tags:
        - channels
      summary: List channels for the app.
      operationId: getChannels
      responses:
        '200':
          description: The channels for the app.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Channel'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
        - channels
      summary: Create a new channel for the app.
      operationId: createChannel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChannelRequest'
      responses:
        '200':
          description: The newly-created channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        default:
          $ref: '#/components/responses/Error'
  /apps/{appId}/releases:
    parameters:
      - $ref: '#/components/parameters/AppId'
    get:
      tags:
        - releases
      summary: List releases for the app.
      operationId: getReleases
      parameters:
        - name: sideloadable
          in: query
          required: false
          schema:
            type: boolean
          description: If true, only return releases that can be sideloaded.
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: The releases for the app, most recently created first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetReleasesResponse'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
        - releases
      summary: Create a new release for the app.
      operationId: createRelease
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReleaseRequest'
      responses:
        '200':
          description: The newly-created release.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateReleaseResponse'
        default:
          $ref: '#/components/responses/Error'
  /apps/{appId}/releases/{releaseId}:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/ReleaseId'
    get:
      tags:
        - releases
      summary: Get a specific release.
      operationId: getRelease
      responses:
        '200':
          description: The requested release.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetReleaseResponse'
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags:
        - releases
      summary: Update the release.
      operationId: updateRelease
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReleaseRequest'
      responses:
        '204':
          description: The release was updated.
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
        - releases
      summary: Delete the release.
      description: |
        Permanently deletes the release and everything that belongs to it:
        its patches, the stored artifacts of every patch, the stored
        artifacts of the release on every platform, and its per-platform
        statuses. Cached patch-check responses for the release version are
        cleared. This cannot be undone.

        Requires the `releases.delete` permission, which the `admin` and
        `owner` roles hold. A "Release and patch only" API key does not.
      operationId: deleteRelease
      responses:
        '204':
          description: The release was deleted.
        '400':
          description: |
            The release id is not an integer
            (`release_id_malformed`), or the release does not belong to
            the app (`release_app_mismatch`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller lacks the `releases.delete` permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The release does not exist (`release_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '424':
          description: |
            A storage, cache, or database step failed partway through.
            The error code names the step that failed
            (`releases_delete_cached_data_error`,
            `releases_delete_patch_artifacts_error`,
            `releases_delete_release_artifacts_error`, or
            `releases_delete_error`). Steps completed before the failure
            are not rolled back.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
  /apps/{appId}/releases/{releaseId}/artifacts:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/ReleaseId'
    get:
      tags:
        - releases
      summary: Get release artifacts.
      operationId: getReleaseArtifacts
      parameters:
        - name: arch
          in: query
          required: false
          schema:
            type: string
        - name: platform
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ReleasePlatform'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: The artifacts for the release.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetReleaseArtifactsResponse'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
        - releases
      summary: Register a new release artifact and obtain an upload URL.
      description: |
        The server returns a record for the artifact plus a signed upload
        URL; clients then `POST` the artifact bytes to that URL.
      operationId: createReleaseArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReleaseArtifactRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateReleaseArtifactRequest'
      responses:
        '200':
          description: The newly-registered release artifact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateReleaseArtifactResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
        - releases
      summary: Delete release artifacts.
      description: |
        Deletes the release's artifacts for one platform, or for every
        platform when `platform` is omitted. This removes the stored
        release artifacts and their records, the stored artifacts of the
        release's patches for that platform, and the platform's entry in
        the release's `platformStatuses`, so the platform no longer
        appears on the release and its artifacts can be uploaded again.
        Cached patch-check responses for the release version (and
        platform) are cleared. The release itself and its patch records
        are kept. Use `DELETE /apps/{appId}/releases/{releaseId}` to remove
        the whole release.

        Requires the `releases.delete` permission, which the `admin` and
        `owner` roles hold. A "Release and patch only" API key does not.
      operationId: deleteReleaseArtifacts
      parameters:
        - name: platform
          in: query
          required: false
          description: |
            The platform whose artifacts to delete. When omitted, the
            artifacts for every platform are deleted.
          schema:
            $ref: '#/components/schemas/ReleasePlatform'
      responses:
        '204':
          description: The artifacts were deleted.
        '400':
          description: |
            The release id is not an integer
            (`release_id_malformed`), or the release does not belong to
            the app (`release_app_mismatch`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller lacks the `releases.delete` permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The release does not exist (`release_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '424':
          description: |
            A storage, cache, or database step failed
            (`release_artifacts_delete_error`). Steps completed before
            the failure are not rolled back.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
  /apps/{appId}/releases/{releaseId}/patches:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/ReleaseId'
    get:
      tags:
        - patches
      summary: List patches for a release.
      operationId: getReleasePatches
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: |
            The patches for the release, in patch number order. A patch
            promoted to more than one channel appears once per channel, and
            a page counts it once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetReleasePatchesResponse'
        default:
          $ref: '#/components/responses/Error'
  /apps/{appId}/releases/{releaseId}/patches/{patchId}:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/ReleaseId'
      - $ref: '#/components/parameters/PatchId'
    patch:
      tags:
        - patches
      summary: Update a patch.
      operationId: updatePatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePatchRequest'
      responses:
        '204':
          description: The patch was updated.
        default:
          $ref: '#/components/responses/Error'
  /apps/{appId}/patches:
    parameters:
      - $ref: '#/components/parameters/AppId'
    post:
      tags:
        - patches
      summary: Create a new patch.
      operationId: createPatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatchRequest'
      responses:
        '201':
          description: The newly-created patch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePatchResponse'
        default:
          $ref: '#/components/responses/Error'
  /apps/{appId}/patches/{patchId}/artifacts:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/PatchId'
    post:
      tags:
        - patches
      summary: Register a new patch artifact and obtain an upload URL.
      operationId: createPatchArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatchArtifactRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreatePatchArtifactRequest'
      responses:
        '200':
          description: The newly-registered patch artifact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePatchArtifactResponse'
        default:
          $ref: '#/components/responses/Error'
  /apps/{appId}/patches/promote:
    parameters:
      - $ref: '#/components/parameters/AppId'
    post:
      tags:
        - patches
      summary: Promote a patch to a channel.
      operationId: promotePatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromotePatchRequest'
      responses:
        '204':
          description: The patch was promoted.
        default:
          $ref: '#/components/responses/Error'
  /apps/{appId}/invitations:
    parameters:
      - $ref: '#/components/parameters/AppId'
    get:
      tags:
        - collaborators
      summary: List the app's pending invitations.
      description: |
        Invitations to collaborate on the app that are still pending, most
        recently sent first. Accepted, declined, revoked and expired
        invitations are left out. Requires the `invitations.view`
        permission.
      operationId: getAppInvitations
      parameters:
        - $ref: '#/components/parameters/PerPage'
          description: |
            The number of invitations per page. This list always pages:
            without `per_page` a page holds 30. Values above 100 are
            treated as 100; values that are not a positive integer are
            treated as 30.
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of the app's pending invitations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInvitationsResponse'
        '400':
          description: The cursor could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller lacks the `invitations.view` permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The app does not exist (`app_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
        - collaborators
      summary: Invite someone to collaborate on the app (no longer available).
      description: |
        Per-app collaborators are being retired in favour of organization
        membership, so this always answers `410` with
        `app_invitations_frozen`; the request body is not read. Invite the
        person to the organization that owns the app instead, with
        `POST /organizations/{organizationId}/invitations`. A caller
        without the `invitations.create` permission gets a `403` instead.
        Pending app invitations can still be listed and revoked.
      operationId: createAppInvitation
      deprecated: true
      responses:
        '403':
          description: The caller lacks the `invitations.create` permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The app does not exist (`app_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: |
            App invitations can no longer be created
            (`app_invitations_frozen`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
  /apps/{appId}/invitations/{invitationId}:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/InvitationId'
    delete:
      tags:
        - collaborators
      summary: Revoke a pending invitation to the app.
      description: |
        Revokes an invitation so it can no longer be accepted. An
        invitation that has passed its expiry but not been replaced can
        still be revoked. Requires the `invitations.revoke` permission.
      operationId: revokeAppInvitation
      responses:
        '204':
          description: The invitation was revoked.
        '403':
          description: The caller lacks the `invitations.revoke` permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            The app does not exist (`app_not_found`), or there is no such
            invitation to this app; an `invitationId` that is not a UUID is
            also a `404` (`app_invitation_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            The invitation was already accepted, declined, revoked, or
            marked expired (`app_invitation_revoke_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
  /apps/{appId}/channels/{channelId}:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/ChannelId'
    delete:
      tags:
        - channels
      summary: Delete a channel.
      description: |
        Deletes the channel. Devices on it stop receiving its patches. The
        default channels (`stable`, `beta` and `staging`) cannot be
        deleted. Requires the `channels.delete` permission.
      operationId: deleteChannel
      responses:
        '204':
          description: The channel was deleted.
        '400':
          description: |
            `channelId` is not an integer
            (`channels_delete_malformed_request`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            The caller lacks the `channels.delete` permission, or the
            channel is a default channel
            (`channels_delete_default_channel`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            The app does not exist (`app_not_found`), or the channel does
            not exist or belongs to another app
            (`channels_delete_channel_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
  /apps/{appId}/releases/{releaseId}/patches/{patchId}/rollback:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/ReleaseId'
      - $ref: '#/components/parameters/PatchId'
    post:
      tags:
        - patches
      summary: Roll back a patch.
      description: |
        Marks the patch rolled back. A rolled-back patch is no longer
        served by the patch check, and devices running it on Flutter
        versions newer than 3.22.3 revert to the most recent patch that is
        not rolled back, or to the base release. Undo with `rollforward`.
        Requires the `patches.rollback` permission.

        Rolling back a patch that is already rolled back changes nothing
        and answers `304`. Either way the cached patch-check responses for
        the release are cleared; if that fails the request answers `424`
        (`patch_rollback_cache_error`) with the patch already rolled back,
        and repeating the request retries the clear.
      operationId: rollbackPatch
      responses:
        '204':
          description: The patch was rolled back.
        '304':
          description: The patch was already rolled back.
        '400':
          description: |
            A path id is not an integer (`release_id_malformed`,
            `patch_id_malformed`), the release does not belong to the app
            (`release_app_mismatch`), or the patch does not belong to the
            release (`patch_release_mismatch`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller lacks the `patches.rollback` permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            The app (`app_not_found`), release (`release_not_found`) or
            patch (`patch_not_found`) does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '424':
          description: |
            Updating the patch failed (`patch_rollback_error`), or the patch
            was rolled back but clearing cached patch-check responses failed
            (`patch_rollback_cache_error`); repeat the request to retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
  /apps/{appId}/releases/{releaseId}/patches/{patchId}/rollforward:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/ReleaseId'
      - $ref: '#/components/parameters/PatchId'
    post:
      tags:
        - patches
      summary: Roll forward a rolled-back patch.
      description: |
        Clears the patch's rolled-back mark, so the patch check serves it
        again. Requires the `patches.promoteToStable` permission.

        Rolling forward a patch that is not rolled back changes nothing and
        answers `304`. Either way the cached patch-check responses for the
        release are cleared; if that fails the request answers `424`
        (`patch_rollforward_cache_error`) with the patch already rolled
        forward, and repeating the request retries the clear.
      operationId: rollforwardPatch
      responses:
        '204':
          description: The patch was rolled forward.
        '304':
          description: The patch was not rolled back.
        '400':
          description: |
            A path id is not an integer (`release_id_malformed`,
            `patch_id_malformed`), the release does not belong to the app
            (`release_app_mismatch`), or the patch does not belong to the
            release (`patch_release_mismatch`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            The caller lacks the `patches.promoteToStable` permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            The app (`app_not_found`), release (`release_not_found`) or
            patch (`patch_not_found`) does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '424':
          description: |
            Updating the patch failed (`patch_rollfoward_error`, spelled
            so), or the patch was rolled forward but clearing cached
            patch-check responses failed (`patch_rollforward_cache_error`);
            repeat the request to retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
  /apps/{appId}/metrics/version-distribution:
    parameters:
      - $ref: '#/components/parameters/AppId'
    get:
      tags:
        - metrics
      summary: Distribution of currently-active devices by release version.
      description: |
        Returns the exact (non-HLL) count of currently-active devices for
        the app, grouped by `release_version`. "Currently active" is
        bounded by a server-side active-device window; rows with no
        reported `release_version` are returned with `releaseVersion: null`
        and represent devices on Flutter versions too old to emit the
        field. The result is sorted by `deviceCount` descending, then
        `releaseVersion` ascending with NULLs last.
      operationId: getVersionDistribution
      responses:
        '200':
          description: The version distribution for the app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVersionDistributionResponse'
        default:
          $ref: '#/components/responses/Error'
  /apps/{appId}/metrics/new-devices:
    parameters:
      - $ref: '#/components/parameters/AppId'
    get:
      tags:
        - metrics
      summary: Devices first seen within the active-device window.
      description: |
        Returns the count of the app's devices whose first recorded activity
        falls within the last `window_days` days — a device-growth signal —
        together with the count
        for the equal-length window immediately preceding it, which powers a
        period-over-period delta. Counts are exact (non-HLL). `previous` is
        null when the preceding window would begin before the metrics data
        floor, where a comparison against partially-recorded history would
        show a misleading delta.
      operationId: getNewDevices
      responses:
        '200':
          description: The new-device counts for the app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetNewDevicesResponse'
        default:
          $ref: '#/components/responses/Error'
  /apps/{appId}/metrics/patch-adoption:
    parameters:
      - $ref: '#/components/parameters/AppId'
    get:
      tags:
        - metrics
      summary: Cumulative patch-adoption curves for a release.
      description: |
        Returns, for a single release, the cumulative adoption of each patch:
        the distinct devices running patch `>= N` (an HLL count over
        `hourly_user_sketches`) over the patch's *target* — the distinct
        devices on the release whose platform the patch was built for. Adoption
        percentages are computed server-side and clamped to `[0.0, 1.0]`;
        clients should render them rather than recompute.

        Values are cumulative ("patch `>= N`"), so they are monotonic
        non-increasing in `patch_number`.

        The release is the `release_version` query parameter, or — when
        omitted — the app's latest release by creation date (`is_latest` flags
        that case). The window defaults to the last 28 days and is capped at 32
        days (the effective window is echoed in `range`). With `granularity`
        omitted, each patch carries a single full-window value (`period: null`);
        set it for a curve at that resolution.
      operationId: getPatchAdoption
      parameters:
        - name: release_version
          in: query
          required: false
          schema:
            type: string
          description: |
            The release to report on. Omitted ⇒ the app's latest release by
            creation date.
        - name: start
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: |
            Window start (UTC, inclusive). Defaults to `end` minus 28 days;
            clamped so the window never exceeds 32 days.
        - name: end
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: |
            Window end (UTC, exclusive). Defaults to now. A window "ending
            now" must omit this parameter rather than send a client-computed
            timestamp — clock skew would silently turn the request into a
            historical query.
        - name: granularity
          in: query
          required: false
          schema:
            type: string
            enum:
              - hour
              - day
              - week
          description: |
            Bucket resolution. Omitted ⇒ a single full-window value per patch
            (`period: null`); set ⇒ one point per bucket at this resolution.
            When set, the window length is rounded down to a whole multiple of
            the bucket size (echoed in `range`).
      responses:
        '200':
          description: The patch-adoption data for one release.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPatchAdoptionResponse'
        default:
          $ref: '#/components/responses/Error'
  /apps/{appId}/metrics/active-hours:
    parameters:
      - $ref: '#/components/parameters/AppId'
    get:
      tags:
        - metrics
      summary: Best time to release — lowest-activity UTC window.
      description: |
        Returns the app's average active-device count per UTC hour-of-day over
        a server-side lookback window, plus the recommended lowest-activity
        consecutive window (the best time to push a patch with minimal user
        disruption) and the busiest hour for contrast. Recommendation fields
        are null when there is insufficient history (fewer than 7 days).
      operationId: getActiveHours
      responses:
        '200':
          description: The active-hours profile and release-time recommendation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetActiveHoursResponse'
        default:
          $ref: '#/components/responses/Error'
  /apps/{appId}/metrics/activity-heatmap:
    parameters:
      - $ref: '#/components/parameters/AppId'
    get:
      tags:
        - metrics
      summary: Activity heatmap — average active devices per UTC weekday-hour.
      description: |
        Returns the app's average distinct active-device count for each
        (UTC day-of-week, UTC hour-of-day) cell over a server-side lookback
        window — a 7×24 activity profile for an insights heatmap. Sourced from
        the same `hourly_user_sketches` data as the active-hours advisor, just
        sliced by weekday as well as hour.
      operationId: getActivityHeatmap
      responses:
        '200':
          description: The 7×24 UTC activity heatmap.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetActivityHeatmapResponse'
        default:
          $ref: '#/components/responses/Error'
  /apps/{appId}/metrics/unique-users:
    parameters:
      - $ref: '#/components/parameters/AppId'
    get:
      tags:
        - metrics
      summary: Unique active devices (MAU) for an app over a window.
      description: |
        Returns the distinct active devices ("unique users") for the app over
        a time window — an HLL-approximated count over `hourly_user_sketches`
        — as a current/previous envelope: `current` covers the effective
        window, `previous` the equal-length window immediately preceding it
        (always computed; powers period-over-period deltas and overlays).
        With `granularity` set, each window also carries a `time_series` at
        that resolution; with `group_by` set, `current` carries a `breakdown`
        per group (each with its own `time_series` when a `granularity` is
        also requested). `previous` never carries a breakdown. Counts are HLL
        approximations. The window defaults to the last 28 days and is capped
        at 450 days; every bound clamps and the effective range is echoed in
        each window's `range`, which clients must treat as authoritative.
      operationId: getUniqueUsers
      parameters:
        - name: start
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Window start (UTC, inclusive). Defaults to `end` minus 28 days.
        - name: end
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: |
            Window end (UTC, exclusive). Defaults to now. A window "ending
            now" must omit this parameter rather than send a client-computed
            timestamp — clock skew would silently turn the request into a
            historical query.
        - name: granularity
          in: query
          required: false
          schema:
            type: string
            enum:
              - hour
              - day
              - week
          description: |
            Bucket resolution for the time series. Omitted ⇒ no `time_series`
            (one merged value per window); set ⇒ one point per bucket at this
            resolution. When set, the window length is rounded down to a whole
            multiple of the bucket size (echoed in `range`), which guarantees
            `current` and `previous` have equal bucket counts.
        - name: group_by
          in: query
          required: false
          schema:
            type: string
            enum:
              - platform
              - release_version
          description: |
            Dimension to break the total down by. Omitted ⇒ no `breakdown`.
            For `release_version`, devices whose client is too old to report
            a release version group under the empty-string `group_value`.
      responses:
        '200':
          description: The unique-users metric for the app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUniqueUsersResponse'
        default:
          $ref: '#/components/responses/Error'
