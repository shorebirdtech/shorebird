        expires_at:
          type: string
          format: date-time
          description: When the invitation stops being valid.
    GetReceivedInvitationsResponse:
      type: object
      description: The response body for GET /invitations.
      required:
        - invitations
      properties:
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/ReceivedInvitation'
          description: The invitations on this page, most recently sent first.
        next_cursor:
          type: string
          description: |
            The opaque cursor of the next page; send it back as `cursor`
            to get that page. Absent on the last page.
    GetOrganizationUsersResponse:
      type: object
      description: The response body for GET /organizations/{organizationId}/users.
      required:
        - users
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationUser'
          description: The list of users that belong to the organization, as well as their roles in the organization.
        next_cursor:
          type: string
          description: |
            The opaque cursor of the next page; send it back as `cursor`
            to get that page.
            Present only when the request was paginated (sent `per_page`,
            `cursor` or `page`) and another page follows. Absent on the last
            page and on unpaginated responses.
        total_count:
          type: integer
          description: |
            How many items the whole list holds. Present only when the
            request was paginated.
    CreatePatchRequest:
      type: object
      description: The request body for POST /apps/{appId}/patches.
      required:
        - release_id
        - metadata
      properties:
        release_id:
          type: integer
          format: int64
          description: The ID of the release.
        metadata:
          type: object
          additionalProperties: true
          description: |
            Additional information about the command that was run to
            create the patch and the environment it was run in.
    CreatePatchResponse:
      type: object
      description: |
        The response body for POST /apps/{appId}/patches. Deliberately
        narrower than [Patch]: a freshly-created patch has no `notes`
        yet (those are set via PATCH /.../{patchId}), so this endpoint
        exposes only the identifiers the client needs to upload
        artifacts.
      required:
        - id
        - number
      properties:
        id:
          type: integer
          format: int64
          description: The unique patch identifier.
        number:
          type: integer
          format: int64
          description: The patch number. A larger number equates to a newer patch.
    CreatePatchArtifactRequest:
      type: object
      description: |
        Metadata for a new patch artifact. POST to
        /apps/{appId}/patches/{patchId}/artifacts and use the returned
        signed upload URL to upload the artifact bytes separately.
      required:
        - arch
        - platform
        - hash
        - size
      properties:
        arch:
          type: string
          description: The arch of the artifact.
        platform:
          $ref: '#/components/schemas/ReleasePlatform'
          description: The platform of the artifact.
        hash:
          type: string
          description: The hash of the artifact.
        hash_signature:
          type: string
          description: 'The signature of the [hash], for a release whose binary embeds the customer''s own key. Null for an unsigned patch. Refused (400) for a release whose binary embeds a managed key: the server signs those patches itself, and fails the request rather than store an unsigned one.'
        podfile_lock_hash:
          type: string
          description: The sha256 hash of the Podfile.lock file, if a Podfile.lock file was involved in the creation of the patch (iOS only).
        size:
          type: integer
          format: int64
          description: The size of the artifact in bytes.
    CreatePatchArtifactResponse:
      type: object
      description: The response body for registering a patch artifact.
      required:
        - id
        - patch_id
        - arch
        - platform
        - hash
        - size
        - url
      properties:
        id:
          type: integer
          format: int64
          description: The ID of the artifact.
        patch_id:
          type: integer
          format: int64
          description: The ID of the patch.
        arch:
          type: string
          description: The arch of the artifact.
        platform:
          $ref: '#/components/schemas/ReleasePlatform'
          description: The platform of the artifact.
        hash:
          type: string
          description: The hash of the artifact.
        size:
          type: integer
          format: int64
          description: The size of the artifact in bytes.
        url:
          type: string
          description: The upload URL for the artifact.
        upload_method:
          $ref: '#/components/schemas/ArtifactUploadMethod'
          description: |
            How to upload the artifact bytes to `url`: a single multipart POST
            (legacy), or a PUT (chunked, resumable) to a resumable session URI.
            Absent on responses from older servers, which implied multipart.
    CreateReleaseArtifactRequest:
      type: object
      description: |
        Metadata for a new release artifact. POST to
        /apps/{appId}/releases/{releaseId}/artifacts and use the
        returned signed upload URL to upload the artifact bytes
        separately.
      required:
        - arch
        - platform
        - hash
        - size
        - filename
      properties:
        arch:
          type: string
          description: The arch of the artifact.
        platform:
          $ref: '#/components/schemas/ReleasePlatform'
          description: The platform of the artifact.
        hash:
          type: string
          description: The hash of the artifact.
        filename:
          type: string
          description: The name of the file.
        can_sideload:
          type: boolean
          description: Whether the artifact can installed and run on a device/emulator as-is.
        size:
          type: integer
          format: int64
          description: The size of the artifact in bytes.
        podfile_lock_hash:
          type: string
          description: The hash of the Podfile.lock file used to create this artifact (iOS only).
        signing:
          $ref: '#/components/schemas/ArtifactSigningRequest'
          description: |
            How the CLI signed the artifact's binary. Older CLIs omit it.
            In a multipart/form-data body it is one field holding the
            JSON-encoded object.
    CreateReleaseArtifactResponse:
      type: object
      description: The response body for registering a release artifact.
      required:
        - id
        - release_id
        - arch
        - platform
        - hash
        - size
        - url
      properties:
        id:
          type: integer
          format: int64
          description: The ID of the artifact.
        release_id:
          type: integer
          format: int64
          description: The ID of the release.
        arch:
          type: string
          description: The arch of the artifact.
        platform:
          $ref: '#/components/schemas/ReleasePlatform'
          description: The platform of the artifact.
        hash:
          type: string
          description: The hash of the artifact.
        size:
          type: integer
          format: int64
          description: The size of the artifact in bytes.
        url:
          type: string
          description: The upload URL for the artifact.
        upload_method:
          $ref: '#/components/schemas/ArtifactUploadMethod'
          description: |
            How to upload the artifact bytes to `url`: a single multipart POST
            (legacy), or a PUT (chunked, resumable) to a resumable session URI.
            Absent on responses from older servers, which implied multipart.
    UpdatePatchRequest:
      type: object
      description: |
        The request body for PATCH
        /apps/{appId}/releases/{releaseId}/patches/{patchId}.
      properties:
        notes:
          type: string
          description: |
            Freeform notes about the patch. If null, notes are unchanged.
    PromotePatchRequest:
      type: object
      description: The request body for POST /apps/{appId}/patches/promote.
      required:
        - patch_id
        - channel_id
      properties:
        patch_id:
          type: integer
          format: int64
          description: The ID of the patch.
        channel_id:
          type: integer
          format: int64
          description: The ID of the channel.
    PatchCheckRequest:
      type: object
      description: The request body for POST /patches/check.
      required:
        - release_version
        - platform
        - arch
        - app_id
        - channel
      properties:
        release_version:
          type: string
          description: The release version of the app.
        patch_number:
          type: integer
          format: int64
          description: |
            The highest patch number the client has already downloaded.
            If provided, the server only returns patches with a higher
            number. If omitted, the server returns the latest available.
        platform:
          $ref: '#/components/schemas/ReleasePlatform'
          description: The platform of the app.
        arch:
          type: string
          description: The architecture of the app.
        app_id:
          type: string
          description: The ID of the app.
        channel:
          type: string
          description: The channel of the app.
        client_id:
          type: string
          description: |
            Unique device ID for the install, generated on device and
            unique per app. Optional for backward compatibility.
        current_patch_number:
          type: integer
          format: int64
          description: |
            The patch number currently running on the device, if any.
            Supersedes `patch_number` for newer clients; unlike
            `patch_number`, this does not affect the server's response.
    PatchCheckResponse:
      type: object
      description: The response body for POST /patches/check.
      required:
        - patch_available
      properties:
        patch_available:
          type: boolean
          description: Whether a patch is available.
        patch:
          $ref: '#/components/schemas/PatchCheckMetadata'
          description: The patch metadata.
        rolled_back_patch_numbers:
          type: array
          items:
            type: integer
            format: int64
          description: The numbers of all patches that have been rolled back for the current release.
    PatchCheckMetadata:
      type: object
      description: |
        Patch metadata representing the contents of a patch for a
        specific platform and architecture.
      required:
        - number
        - download_url
        - hash
      properties:
        number:
          type: integer
          format: int64
          description: The patch number associated with the artifact.
        download_url:
          type: string
          description: The URL of the artifact.
        hash:
          type: string
          description: The hash of the artifact.
        hash_signature:
          type: string
          description: The signature of the `hash`.
    VersionDistributionEntry:
      type: object
      description: |
        One bucket in a version-distribution chart: the exact count of
        currently-active devices on a given release version. A null
        `release_version` represents devices whose client did not emit one
        (typically very old Flutter clients).
      required:
        - release_version
        - device_count
        - percentage
      properties:
        release_version:
          type: string
          nullable: true
          description: |
            The release version for this bucket, or null for devices whose
            client did not emit one.
        device_count:
          type: integer
          format: int64
          description: |
            Number of currently-active devices on this release version
            within the active-device window.
        percentage:
          type: number
          format: double
          description: |
            Fractional share of currently-active devices on this release
            version, in [0.0, 1.0]. Server is the source of truth; clients
            should render this value rather than recomputing it.
    GetVersionDistributionResponse:
      type: object
      description: |
        The response body for GET /apps/{appId}/metrics/version-distribution.
      required:
        - entries
        - total_devices
        - active_window_days
        - as_of
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/VersionDistributionEntry'
          description: |
            One entry per release version, sorted by `device_count`
            descending, then `release_version` ascending with NULLs last.
        total_devices:
          type: integer
          format: int64
          description: |
            Sum of `device_count` across all entries. Convenience for
            clients; matches the server-side sum used to compute
            `percentage`.
        active_window_days:
          type: integer
          description: |
            The active-device window in days that bounds the query.
            Hardcoded server-side in v1; tier-gated per-caller windows
            land in a follow-up.
        as_of:
          type: string
          format: date-time
          description: |
            Server's UTC timestamp at the moment the response was
            constructed. Not a freshness indicator for the underlying
            data, which is refreshed by an hourly scheduled query and
            may lag by up to ~1 hour.
    GetNewDevicesResponse:
      type: object
      description: |
        The response body for GET /apps/{appId}/metrics/new-devices.
      required:
        - current
        - previous
        - window_days
        - as_of
      properties:
        current:
          type: integer
          format: int64
          description: |
            Devices first seen in the window `[as_of − window_days, as_of)`.
            An exact (non-HLL) count.
        previous:
          type: integer
          format: int64
          nullable: true
          description: |
            Devices first seen in the equal-length window immediately
            preceding the current one, or null when that window would begin
            before the metrics data floor (comparing against
            partially-recorded history would show a misleading delta).
        window_days:
          type: integer
          description: |
            The window length in days. Hardcoded server-side in v1; echoed
            so clients label the metric from the response rather than
            assuming a length.
        as_of:
          type: string
          format: date-time
          description: |
            Server's UTC timestamp at the moment the response was
            constructed. Not a freshness indicator for the underlying
            data, which is refreshed by an hourly scheduled query and
            may lag by up to ~1 hour.
    PatchAdoptionPoint:
      type: object
      description: |
        One point in a patch's adoption series: the cumulative distinct
        devices on `patch >= patch_number` (`devices`) over the patch's target
        (`target`), and their ratio (`adoption_pct`), for one bucket.
      required:
        - period
        - devices
        - target
        - adoption_pct
      properties:
        period:
          type: string
          format: date-time
          nullable: true
          description: |
            The bucket start (UTC), or null when the response is a single
            full-window value (no granularity requested).
        devices:
          type: integer
          format: int64
          description: |
            Distinct devices running patch `>= patch_number` on the patch's
            target platform(s) within this bucket (an HLL count).
        target:
          type: integer
          format: int64
          description: |
            Distinct devices on the release whose platform the patch targets —
            the patch's reachable denominator — within this bucket.
        adoption_pct:
          type: number
          format: double
          description: |
            `devices / target`, in [0.0, 1.0] (0 when `target` is 0). Server
            is the source of truth; clients should render this value rather
            than recomputing it.
    PatchAdoptionEntry:
      type: object
      description: |
        Cumulative adoption for one patch of the release. Values are
        cumulative — "patch `>= patch_number`" — so they are monotonic
        non-increasing in `patch_number`.
      required:
        - patch_number
        - target_platforms
        - is_rolled_back
        - series
      properties:
        patch_number:
          type: integer
          format: int64
          description: |
            The patch number these cumulative values are anchored at.
        target_platforms:
          type: array
          items:
            $ref: '#/components/schemas/ReleasePlatform'
          description: |
            The platform(s) the patch was built for (from its artifacts). The
            denominator counts only devices on these platforms.
        is_rolled_back:
          type: boolean
          description: Whether the patch has been rolled back.
        series:
          type: array
          items:
            $ref: '#/components/schemas/PatchAdoptionPoint'
          description: |
            The adoption series. Exactly one point (`period: null`) when no
            granularity was requested; otherwise one point per bucket, ordered
            by `period` ascending.
    MetricsRange:
      type: object
      description: |
        The effective (post-default, post-clamp) window a metrics response —
        or one window of a metrics envelope — covers. Always echoed by the
        server; clients must treat it as authoritative rather than reusing
        the requested range.
      required:
        - start
        - end
      properties:
        start:
          type: string
          format: date-time
          description: Window start (UTC, inclusive).
        end:
          type: string
          format: date-time
          description: Window end (UTC, exclusive).
    GetPatchAdoptionResponse:
      type: object
      description: |
        The response body for GET /apps/{appId}/metrics/patch-adoption. Covers
        exactly one release.
      required:
        - release_version
        - is_latest
        - granularity
        - range
        - as_of
        - patches
      properties:
        release_version:
          type: string
          description: The release version this response is for.
        is_latest:
          type: boolean
          description: |
            True when the release was resolved via the "latest release by
            creation date" default (no `release_version` was supplied).
        granularity:
          type: string
          nullable: true
          description: |
            The bucket resolution (`hour`, `day`, or `week`), or null
            when each patch carries a single full-window value.
        range:
          $ref: '#/components/schemas/MetricsRange'
        as_of:
          type: string
          format: date-time
          description: |
            Server's UTC timestamp at the moment the response was
            constructed. Not a freshness indicator for the underlying
            data, which is refreshed by an hourly scheduled query and
            may lag by up to ~1 hour.
        patches:
          type: array
          items:
            $ref: '#/components/schemas/PatchAdoptionEntry'
          description: One entry per patch of the release.
    ActiveHourEntry:
      type: object
      description: |
        Average number of distinct active devices during one UTC hour-of-day,
        averaged across all days in the lookback window (days with no activity
        in that hour count as zero).
      required:
        - hour_utc
        - average_active_devices
      properties:
        hour_utc:
          type: integer
          description: Hour of day in UTC, 0–23.
        average_active_devices:
          type: number
          format: double
          description: |
            Mean distinct active devices seen during this UTC hour, averaged
            over the lookback window with implicit zeros included.
    GetActiveHoursResponse:
      type: object
      description: |
        The response body for GET /apps/{appId}/metrics/active-hours. Powers the
        "best time to release" recommendation: the consecutive low-activity UTC
        window when the app's users are least active.
      required:
        - hourly
        - recommended_window_start_utc
        - recommended_window_length_hours
        - busiest_hour_utc
        - lookback_days
        - as_of
      properties:
        hourly:
          type: array
          items:
            $ref: '#/components/schemas/ActiveHourEntry'
          description: |
            One entry per UTC hour: 24 entries, hour_utc 0–23, zero-filled,
            ordered by hour_utc ascending.
        recommended_window_start_utc:
          type: integer
          nullable: true
          description: |
            Start hour (UTC, 0–23) of the lowest-activity consecutive window —
            the recommended time to release. The window wraps past midnight.
            Null when there is insufficient data (fewer than 7 days).
        recommended_window_length_hours:
          type: integer
          description: |
            Length of the recommended window in hours. Fixed at 2 in v1.
        busiest_hour_utc:
          type: integer
          nullable: true
          description: |
            UTC hour (0–23) with the highest average active devices, for
            contrast in the recommendation copy. Null when insufficient data.
        lookback_days:
          type: integer
          description: |
            Number of days of history the profile is computed over.
        as_of:
          type: string
          format: date-time
          description: |
            Server's UTC timestamp at the moment the response was constructed.
            Not a freshness indicator for the underlying data, which is
            refreshed by an hourly scheduled query and may lag by up to ~1 hour.
    ActivityHeatmapCell:
      type: object
      description: |
        Average number of distinct active devices during one (UTC day-of-week,
        UTC hour-of-day) cell, averaged across every occurrence of that weekday
        in the lookback window (occurrences with no activity count as zero).
      required:
        - day_of_week_utc
        - hour_utc
        - average_active_devices
      properties:
        day_of_week_utc:
          type: integer
          description: |
            Day of week in UTC, 1–7 where 1 = Sunday and 7 = Saturday.
        hour_utc:
          type: integer
          description: Hour of day in UTC, 0–23.
        average_active_devices:
          type: number
          format: double
          description: |
            Mean distinct active devices seen during this UTC weekday-hour,
            averaged over the weekday's occurrences in the window with implicit
            zeros included.
    GetActivityHeatmapResponse:
      type: object
      description: |
        The response body for GET /apps/{appId}/metrics/activity-heatmap. A 7×24
        grid of average active devices per UTC weekday-hour, powering the
        insights activity heatmap.
      required:
        - cells
        - busiest_day_of_week_utc
        - busiest_hour_utc
        - lookback_days
        - as_of
      properties:
        cells:
          type: array
          items:
            $ref: '#/components/schemas/ActivityHeatmapCell'
          description: |
            168 entries (7 weekdays × 24 hours), zero-filled, ordered by
            day_of_week_utc (1–7) then hour_utc (0–23) ascending.
        busiest_day_of_week_utc:
          type: integer
          nullable: true
          description: |
            UTC day-of-week (1–7) of the cell with the highest average active
            devices, for peak-relative coloring and labeling. Null when there is
            no data.
        busiest_hour_utc:
          type: integer
          nullable: true
          description: |
            UTC hour (0–23) of the busiest cell. Null when there is no data.
        lookback_days:
          type: integer
          description: |
            Number of days of history the heatmap is computed over.
        as_of:
          type: string
          format: date-time
          description: |
            Server's UTC timestamp at the moment the response was constructed.
            Not a freshness indicator for the underlying data, which is
            refreshed by an hourly scheduled query and may lag by up to ~1 hour.
    UniqueUsersTimeSeriesEntry:
      type: object
      description: |
        One bucket of a unique-users time series: the HLL count of distinct
        active devices in the bucket starting at `period`.
      required:
        - period
        - unique_users
      properties:
        period:
          type: string
          format: date-time
          description: The bucket start (UTC).
        unique_users:
          type: integer
          format: int64
          description: Distinct active devices in this bucket (an HLL count).
    UniqueUsersBreakdownEntry:
      type: object
      description: |
        Unique users for one value of the `group_by` dimension (e.g. one
        platform), optionally with its own time series.
      required:
        - group_by
        - group_value
        - unique_users
      properties:
        group_by:
          type: string
          description: The dimension this entry breaks down by (e.g. "platform").
        group_value:
          type: string
          description: |
            The value within `group_by` (e.g. "android"). For
            `group_by=release_version`, the empty string is the
            unknown-version group — devices whose client is too old to
            report a release version.
        unique_users:
          type: integer
          format: int64
          description: |
            Distinct active devices for this group over the window (an HLL
            count).
        time_series:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/UniqueUsersTimeSeriesEntry'
          description: |
            Per-bucket series for this group, present only when a `granularity`
            was requested; otherwise null.
    UniqueUsersWindow:
      type: object
      description: |
        One window of the unique-users envelope: the HLL-merged total over
        the window's effective range, with a per-bucket series when a
        `granularity` was requested. This base atom is the full shape of
        `previous`; `current` extends it (see UniqueUsersCurrentWindow).
      required:
        - unique_users
        - range
      properties:
        unique_users:
          type: integer
          format: int64
          description: |
            Distinct active devices over this window (an HLL count). Note:
            per-bucket `time_series` values do not sum to this — an HLL merge
            over the window is not a sum of per-bucket merges.
        range:
          $ref: '#/components/schemas/MetricsRange'
        time_series:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/UniqueUsersTimeSeriesEntry'
          description: |
            Per-bucket series for this window, present only when a
            `granularity` was requested; otherwise null. On `previous`, also
            null when the prior window reaches past the plan's metrics-history
            horizon (the total is still present — only the granular overlay is
            withheld). Empty buckets are omitted — gap-fill against this
            window's `range`.
    UniqueUsersCurrentWindow:
      description: |
        The `current` window of the unique-users envelope: the base window
        atom plus the optional `breakdown`. Only `current` carries a
        breakdown — no chart renders a previous-window breakdown, so the
        asymmetry is declared in the contract rather than left as an
        optional-but-never-populated field.
      allOf:
        - $ref: '#/components/schemas/UniqueUsersWindow'
        - type: object
          properties:
            breakdown:
              type: array
              nullable: true
              items:
                $ref: '#/components/schemas/UniqueUsersBreakdownEntry'
              description: |
                Per-group unique users for this window, present only when a
                `group_by` was requested; otherwise null.
    GetUniqueUsersResponse:
      type: object
      description: |
        The response body for GET /apps/{appId}/metrics/unique-users: a
        current/previous envelope. `previous` covers the equal-length window
        immediately preceding `current`; period-over-period deltas are client
        display logic over the two totals. `previous` is always present but is
        null when the prior window predates the data floor (no comparison data
        exists). When it reaches past the plan's metrics-history horizon,
        `previous` is non-null with its total — the delta renders — but without
        a `time_series` (no prior-window overlay): granular history is the
        resolution the horizon gates, the scalar comparison is not.
      required:
        - as_of
        - granularity
        - current
        - previous
      properties:
        as_of:
          type: string
          format: date-time
          description: |
            Server's UTC timestamp at the moment the response was constructed.
            Not a freshness indicator for the underlying data, which is
            refreshed by an hourly scheduled query and may lag by up to ~1 hour.
        granularity:
          type: string
          nullable: true
          description: |
            The time-series bucket resolution (`hour`, `day`, or `week`), or
            null when no time series was requested. Applies to both windows.
        current:
          $ref: '#/components/schemas/UniqueUsersCurrentWindow'
        previous:
          anyOf:
            - $ref: '#/components/schemas/UniqueUsersWindow'
            - type: 'null'
          description: |
            The equal-length window immediately preceding `current`. Always
            present, but null when that prior window predates the data floor —
            there is no comparison data, so reporting a fabricated undercount is
            worse than returning null. When the prior window instead reaches
            past the plan's metrics-history horizon, this is non-null with its
            `unique_users` total (the delta) but no `time_series` (the overlay
            is the granular resolution the horizon gates).
    PatchMetricTimeSeriesEntry:
      type: object
      description: |
        One bucket of a patch-metric time series: the summed count (installs or
        downloads, per the endpoint) in the bucket starting at `period`.
      required:
        - period
        - count
      properties:
        period:
          type: string
          format: date-time
          description: The bucket start (UTC).
        count:
          type: integer
          format: int64
          description: The summed count in this bucket.
    PatchMetricBreakdownEntry:
      type: object
      description: |
        A patch metric for one value of the `group_by` dimension (one release
        at app scope, or one patch at release scope), optionally with its own
        time series.
      required:
        - group_by
        - group_value
        - count
      properties:
        group_by:
          type: string
          description: The dimension this entry breaks down by ("release" or "patch").
        group_value:
          type: string
          description: |
            The value within `group_by`: the release version, or the patch
            number as a string.
        count:
          type: integer
          format: int64
          description: The summed count for this group over the window.
        time_series:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/PatchMetricTimeSeriesEntry'
          description: |
            Per-bucket series for this group, present only when a `granularity`
            was requested; otherwise null.
    PatchMetricWindow:
      type: object
      description: |
        One window of the patch-metric envelope: the summed count over the
        window's effective range, with a per-bucket series when a `granularity`
        was requested. This base atom is the full shape of `previous`;
        `current` extends it (see PatchMetricCurrentWindow).
      required:
        - count
        - range
      properties:
        count:
          type: integer
          format: int64
          description: |
            The summed count (installs or downloads) over this window. Unlike
            the HLL-based metrics, per-bucket `time_series` values sum to this
            total.
        range:
          $ref: '#/components/schemas/MetricsRange'
        time_series:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/PatchMetricTimeSeriesEntry'
          description: |
            Per-bucket series for this window, present only when a
            `granularity` was requested; otherwise null. On `previous`, also
            null when the prior window reaches past the plan's metrics-history
            horizon (the total is still present — only the granular overlay is
            withheld). Empty buckets are omitted — gap-fill against this
            window's `range`.
    PatchMetricCurrentWindow:
      description: |
        The `current` window of the patch-metric envelope: the base window atom
        plus the optional `breakdown`. Only `current` carries a breakdown — no
        chart renders a previous-window breakdown, so the asymmetry is declared
        in the contract rather than left as an optional-but-never-populated
        field.
      allOf:
        - $ref: '#/components/schemas/PatchMetricWindow'
        - type: object
          properties:
            breakdown:
              type: array
              nullable: true
              items:
                $ref: '#/components/schemas/PatchMetricBreakdownEntry'
              description: |
                Per-group counts for this window, present only when a
                `group_by` was requested; otherwise null.
    GetPatchMetricResponse:
      type: object
      description: |
        The response body for the patch-installs and patch-downloads metric
        endpoints (app- and release-scoped): a current/previous envelope.
        `previous` covers the equal-length window immediately preceding
        `current`; period-over-period deltas are client display logic over the
        two totals. `previous` is omitted only when the prior window predates
        the data floor (no comparison data exists). When it reaches past the
        plan's metrics-history horizon, `previous` is still present with its
        total — the delta renders — but without a `time_series` (no
        prior-window overlay): granular history is the resolution the horizon
        gates, the scalar comparison is not.
      required:
        - as_of
        - granularity
        - current
      properties:
        as_of:
          type: string
          format: date-time
          description: |
            Server's UTC timestamp at the moment the response was constructed.
            Not a freshness indicator for the underlying data, which is
            refreshed by an hourly scheduled job and may lag by up to ~1 hour.
        granularity:
          type: string
          nullable: true
          description: |
            The time-series bucket resolution (`hour`, `day`, or `week`), or
            null when no time series was requested. Applies to both windows.
        current:
          $ref: '#/components/schemas/PatchMetricCurrentWindow'
        previous:
          $ref: '#/components/schemas/PatchMetricWindow'
          description: |
            The equal-length window immediately preceding `current`. Omitted
            only when that prior window predates the data floor — there is no
            comparison data, so reporting a fabricated count is worse than
            omitting it. When the prior window instead reaches past the plan's
            metrics-history horizon, this is present with its `count` total
            (the delta) but no `time_series` (the overlay is the granular
            resolution the horizon gates).
    UpdateUserRequest:
      type: object
      description: |
        The request body for PATCH /users/me. A field left out is left
        unchanged.
      properties:
        display_name:
          type: string
          description: The user's new display name. At most 256 characters.
        patch_overage_limit:
          type:
            - integer
            - 'null'
          format: int64
          description: |
            The most patch installs past the plan's allotment the user
            agrees to pay for each overage period. `0` turns overage off;
            `null` removes the limit. Must not be negative.
    NotificationPreferences:
      type: object
      description: How the user wants to be notified.
      required:
        - are_email_notifications_enabled
      properties:
        are_email_notifications_enabled:
          type: boolean
          description: |
            Whether the user receives email notifications. `true` for a
            user who has never set it.
    GetNotificationPreferencesResponse:
      type: object
      description: The response body for GET /users/me/notification_preferences.
      required:
        - preferences
      properties:
        preferences:
          $ref: '#/components/schemas/NotificationPreferences'
    UpdateNotificationPreferencesRequest:
      type: object
      description: |
        The request body for PATCH /users/me/notification_preferences. A
        field left out, or sent as `null`, is left unchanged.
      properties:
        are_email_notifications_enabled:
          type:
            - boolean
            - 'null'
          description: Whether the user should receive email notifications.
    GetInvitationResponse:
      type: object
      description: |
        The response body for GET /invitations/{invitationId}. Exactly one
        of `organization_id` and `app_id` is non-null.
      required:
        - id
        - organization_id
        - app_id
        - target_name
        - inviter_email
        - email
        - role
        - expires_at
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the invitation.
        organization_id:
          type:
            - integer
            - 'null'
          format: int64
          description: The organization the invitation is to, or null for an app invitation.
        app_id:
          type:
            - string
            - 'null'
          description: The app the invitation is to, or null for an organization invitation.
        target_name:
          type: string
          description: The organization's name or the app's display name.
        inviter_email:
          type: string
          description: The email of the user who sent the invitation.
        email:
          type: string
          description: The email address the invitation was sent to.
        role:
          $ref: '#/components/schemas/Role'
          description: The role accepting the invitation grants.
        expires_at:
          type: string
          format: date-time
          description: When the invitation stops being valid.
    Plan:
      type: object
      description: |
        The subscription an account is on: what it costs, what it
        includes, and how installs past the allotment are handled. An
        account with no subscription is on the free Hobby plan, whose
        billing period is the calendar month.

        Several fields are strings rather than enums so that new values
        can be added without breaking clients; their current values are
        listed in each description.
      required:
        - name
        - currency
        - base_price
        - base_install_count
        - patch_install_credit
        - patch_overage_limit
        - price_per_overage_install
        - current_period_start
        - current_period_end
        - cancel_at_period_end
        - is_tiered
        - is_trial
        - base_standing
        - overage_standing
        - overage_state
        - overage_blocked_by
        - overage_period_start
        - overage_period_end
        - features
        - level
        - minimum_releases_kept
        - max_team_size
        - available_roles
        - billing_interval
        - billing_interval_count
        - subscriber_since
      properties:
        name:
          type: string
          description: The plan's display name.
        currency:
          type: string
          description: The ISO 4217 code of the plan's currency (e.g. `usd`).
        base_price:
          type: integer
          format: int64
          description: |
            The list price per billing period, in minor units of
            `currency` (e.g. cents), whatever the installs used. Does not
            reflect coupons or discounts.
        base_install_count:
          type: integer
          format: int64
          description: The patch installs included in the base price each billing period.
        patch_install_credit:
          type: integer
          format: int64
          description: |
            Extra patch installs granted to the account's owner on top of
            `base_install_count`, such as promotional or support credit.
            `0` when there is none.
        patch_overage_limit:
          type:
            - integer
            - 'null'
          format: int64
          description: |
            The most installs past the allotment the owner has agreed to
            pay for each overage period: their spending limit, in
            installs. Null when the owner has set no limit.
        price_per_overage_install:
          type:
            - string
            - 'null'
          description: |
            The price of each install past the allotment, in minor units
            of `currency`, as a decimal number in a string because it can
            be fractional (e.g. `"0.1"`). Null when the plan has no
            overage billing.
        current_period_start:
          type: string
          format: date-time
          description: |
            The start of the current billing period. The start of the
            current month on the Hobby plan.
        current_period_end:
          type: string
          format: date-time
          description: |
            The end of the current billing period. The start of the next
            month on the Hobby plan.
        cancel_at_period_end:
          type: boolean
          description: Whether the subscription is set to end at the end of the current billing period.
        is_tiered:
          type: boolean
          description: Whether the plan is one of the standard tiers an account can switch between.
        is_trial:
          type: boolean
          description: Whether the account is on a trial, which is not billed and ends on its own.
        base_standing:
          type: string
          description: |
            The payment standing of the subscription carrying the plan:
            `none` (no subscription), `trialing`, `active`, or `past_due`.
            `past_due` keeps the plan in force while Stripe retries the
            payment; prompt for a working payment method.
        overage_standing:
          type: string
          description: |
            The payment standing of the subscription carrying the overage
            price, in the same terms as `base_standing` plus `unpaid`
            (every retry failed and only paying the invoice resumes
            overage). Equal to `base_standing` when overage bills on the
            base subscription; independent when an annual plan bills
            overage on its own monthly subscription. `none` when the plan
            has no overage billing.
        overage_state:
          type: string
          description: |
            Whether installs past the allotment are served, and on what
            terms: `unavailable` (the plan has no overage billing), `off`
            (the limit is `0`), `blocked` (a payment is overdue; see
            `overage_blocked_by`), `capped` (up to `patch_overage_limit`
            each overage period), or `unlimited`.
        overage_blocked_by:
          type:
            - string
            - 'null'
          description: |
            Which overdue payment holds overage back while
            `overage_state` is `blocked`: `base_past_due`,
            `overage_past_due`, or `overage_unpaid`. Null otherwise.
        overage_period_start:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            The start of the period overage is capped and invoiced over:
            the billing period for a monthly plan, the overage
            subscription's own month for an annual one. Null when the
            plan has no overage billing.
        overage_period_end:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            The end of the period overage is capped and invoiced over.
            Null when the plan has no overage billing.
        features:
          type: array
          items:
            type: string
          description: |
            The features the plan enables. Current values:
            `collaboration`, `historicalInsights`, `audienceAnalytics`,
            `customTokenExpiration`, `auditLogs`, `sizeAnalysis`,
            `oidcFederation`.
        level:
          type: string
          description: 'The plan''s tier: `free`, `pro`, `business`, or `enterprise`.'
        minimum_releases_kept:
          type:
            - integer
            - 'null'
          format: int64
          description: |
            How many of an app's releases are kept however long they sit
            unused. Null when releases are never retired.
        max_team_size:
          type:
            - integer
            - 'null'
          format: int64
          description: |
            The most members an account may have: `1` on plans without
            collaboration, null when there is no limit.
        available_roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          description: The roles that may be given to members on this plan.
        billing_interval:
          type:
            - string
            - 'null'
          description: |
            The unit the subscription bills on: `day`, `week`, `month`, or
            `year`. Null without a subscription.
        billing_interval_count:
          type:
            - integer
            - 'null'
          format: int64
          description: |
            How many `billing_interval`s make one billing period. Null
            without a subscription.
        subscriber_since:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            When the subscription started; unchanged by renewals and plan
            changes. Null without a subscription.
    AppUsage:
      type: object
      description: Patch installs of one app this allotment period.
      required:
        - id
        - name
        - patch_install_count
      properties:
        id:
          type: string
          description: The ID of the app.
        name:
          type: string
          description: The display name of the app.
        patch_install_count:
          type: integer
          format: int64
          description: The app's patch installs this allotment period.
    AccountPosition:
      type: object
      description: |
        Where the account stands against its plan right now, worked out by
        the server so every client shows the same figures. Counts are per
        allotment period (the base subscription's billing period) unless
        said otherwise. Overage is per overage period, which for an annual
        plan is the month its overage subscription bills on.
      required:
        - included_installs
        - installs
        - included_installs_used
        - included_exhausted
        - overage_installs
        - install_ceiling
        - remaining_installs
        - at_ceiling
        - nearing_limit
        - consuming_overage
        - accrued_overage_amount
      properties:
        included_installs:
          type: integer
          format: int64
          description: |
            Installs the account may make this allotment period before
            overage begins: the plan's allotment plus any credit.
        installs:
          type: integer
          format: int64
          description: Installs served so far this allotment period.
        included_installs_used:
          type: integer
          format: int64
          description: |
            Installs taken from the included allotment. Installs billed as
            overage are not counted here.
        included_exhausted:
          type: boolean
          description: Whether the included allotment is used up.
        overage_installs:
          type: integer
          format: int64
          description: |
            Overage installs billed this overage period, capped at the
            spending limit. `0` when the plan has no overage billing.
        install_ceiling:
          type:
            - integer
            - 'null'
          format: int64
          description: |
            The install count at which patches stop being served, or null
            when nothing stops them.
        remaining_installs:
          type:
            - integer
            - 'null'
          format: int64
          description: Installs left before `install_ceiling`, or null when there is no ceiling.
        at_ceiling:
          type: boolean
          description: Whether `install_ceiling` has been reached.
        nearing_limit:
          type: boolean
          description: |
            Whether installs have reached the share of `install_ceiling`
            at which Shorebird emails a warning.
        consuming_overage:
          type: boolean
          description: Whether installs are being billed as overage right now.
        accrued_overage_amount:
          type:
            - string
            - 'null'
          description: |
            What `overage_installs` costs at the plan's overage price, in
            minor units of the plan's currency, as a decimal number in a
            string because it can be fractional. Null when the plan has
            no overage billing.
    GetUsageResponse:
      type: object
      description: |
        The response body for GET /usage and
        GET /organizations/{organizationId}/usage.
      required:
        - apps
        - position
        - reported_overage
      properties:
        apps:
          type: array
          items:
            $ref: '#/components/schemas/AppUsage'
          description: |
            Patch installs this allotment period for each app in every
            organization the account's owner owns.
        position:
          $ref: '#/components/schemas/AccountPosition'
          description: Where the account stands against its plan.
        reported_overage:
          type:
            - integer
            - 'null'
          format: int64
          description: |
            Overage installs already reported to Stripe for billing this
            overage period. Null when the plan has no overage billing.
    CreateOrganizationRequest:
      type: object
      description: The request body for POST /organizations.
      required:
        - name
      properties:
        name:
          type: string
          description: The name of the organization. Must not be blank.
    UpdateOrganizationRequest:
      type: object
      description: The request body for PATCH /organizations/{organizationId}.
      required:
        - name
      properties:
        name:
          type: string
          description: The new name of the organization. Must not be blank.
    TransferOrganizationAppRequest:
      type: object
      description: The request body for POST /organizations/{organizationId}/apps.
      required:
        - app_id
      properties:
        app_id:
          type: string
          description: The ID of the app to move into the organization.
    UpdateOrganizationUserRequest:
      type: object
      description: |
        The request body for PATCH
        /organizations/{organizationId}/users/{userId}.
      required:
        - role
      properties:
        role:
          $ref: '#/components/schemas/Role'
          description: |
            The member's new role. `owner` transfers ownership of the
            organization to the member.
    CreateOrganizationInvitationRequest:
      type: object
      description: The request body for POST /organizations/{organizationId}/invitations.
      required:
        - email
        - role
      properties:
        email:
          type: string
          format: email
          description: The email address to send the invitation to.
        role:
          $ref: '#/components/schemas/Role'
          description: |
            The role the invitee gets on accepting. `owner` is refused.
    CreateInvitationResponse:
      type: object
      description: |
        The response body for creating an invitation to an organization or
        an app.
      required:
        - type
        - email
      properties:
        type:
          type: string
          const: invitation
          description: |
            Always `invitation`: what was created is a pending invitation,
            not a membership.
        email:
          type: string
          description: The email the invitation was sent to.
    AddedMemberResponse:
      type: object
      description: |
        The response body for inviting an account that is already in the
        directory of the organization's enterprise: it was added as a member
        at once, and no invitation was sent.
      required:
        - type
        - email
        - role
      properties:
        type:
          type: string
          const: member
          description: |
            Always `member`: what was created is a membership, not a pending
            invitation.
        email:
          type: string
          description: The email the request named.
        role:
          $ref: '#/components/schemas/Role'
    InvitationSummary:
      type: object
      description: A pending invitation, as listed to the people who manage it.
      required:
        - id
        - email
        - role
        - created_at
        - expires_at
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the invitation, which revoking it takes.
        email:
          type: string
          description: The email the invitation was sent to.
        role:
          $ref: '#/components/schemas/Role'
          description: The role the invitee gets on accepting.
        created_at:
          type: string
          format: date-time
          description: When the invitation was sent.
        expires_at:
          type: string
          format: date-time
          description: When the invitation stops being valid.
    GetInvitationsResponse:
      type: object
      description: |
        The response body for listing the pending invitations to an
        organization or an app.
      required:
        - invitations
      properties:
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/InvitationSummary'
          description: The invitations on this page, most recently sent first.
        next_cursor:
          type: string
          description: |
            The opaque cursor of the next page; send it back as `cursor`
            to get that page. Absent on the last page.
    AuditLogOrder:
      type: string
      description: The order audit log entries are listed in.
      enum:
        - desc
        - asc
      x-enum-descriptions:
        - Newest first.
        - Oldest first, holding back entries younger than 60 seconds, for polling.
    GetOrganizationAuditLogsResponse:
      type: object
      description: The response body for GET /organizations/{organizationId}/audit-logs.
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEvent'
          description: The entries on this page, in the requested order.
        next_cursor:
          type: string
          description: |
            The opaque cursor of the next page; send it back as `cursor`
            to get that page. Newest first, absent on the last page. Oldest
            first, always present: the last entry's position, or the cursor
            that was sent when the page is empty.
    AuditLogEvent:
      type: object
      description: |
        One audit log entry, as an OCSF 1.9.0 API Activity event
        (https://schema.ocsf.io/1.9.0/classes/api_activity). Fields OCSF has
        no place for are in `unmapped`.

        An entry Shorebird staff caused names its actor only as
        `Shorebird staff`, and carries no key, session, IP address or user
        agent.
      required:
        - class_uid
        - category_uid
        - activity_id
        - type_uid
        - time
        - severity_id
        - status_id
        - metadata
        - api
        - actor
        - src_endpoint
        - resources
        - unmapped
      properties:
        class_uid:
          type: integer
          const: 6003
          description: The OCSF class, always API Activity (6003).
        category_uid:
          type: integer
          const: 6
          description: The OCSF category, always Application Activity (6).
        activity_id:
          type: integer
          description: |
            What kind of operation this was: 1 create, 2 read, 3 update,
            4 delete (or revoke), 99 other (such as a refused request).
        type_uid:
          type: integer
          description: '`class_uid * 100 + activity_id`, as OCSF defines it.'
        time:
          type: integer
          format: int64
          description: When the entry was recorded, in milliseconds since the Unix epoch.
        severity_id:
          type: integer
          const: 1
          description: Always 1 (Informational).
        status_id:
          type: integer
          const: 1
          description: Always 1 (Success).
        metadata:
          $ref: '#/components/schemas/AuditLogEventMetadata'
        api:
          $ref: '#/components/schemas/AuditLogApi'
        actor:
          $ref: '#/components/schemas/AuditLogActor'
        src_endpoint:
          $ref: '#/components/schemas/AuditLogSourceEndpoint'
        http_request:
          $ref: '#/components/schemas/AuditLogHttpDetails'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogResource'
          description: What the operation acted on. Always exactly one entry.
        unmapped:
          type: object
          additionalProperties: true
          description: |
            Fields OCSF has no place for, keyed in snake_case: the event's
            own metadata (which varies by event, nested keys included),
            `app_id` when the entry is about an app, `enterprise_id` when it
            belongs to an enterprise, and `actor_source`, the kind of
            credential that acted (for example `session`, `api_key`,
            `service_account`, `federated` or `admin_api`), when known.
    AuditLogEventMetadata:
      type: object
      description: OCSF `metadata` for an audit log entry.
      required:
        - version
        - product
        - uid
        - log_name
      properties:
        version:
          type: string
          description: The OCSF schema version, `1.9.0`.
        product:
          $ref: '#/components/schemas/AuditLogProduct'
        uid:
          type: string
          description: The entry's ID, as a string.
        tenant_uid:
          type: string
          description: |
            The organization's ID, as a string. Absent for an event above
            any organization, which belongs to an enterprise alone (its
            `unmapped.enterprise_id`).
        log_name:
          type: string
          const: audit
          description: Always `audit`.
        correlation_uid:
          type: string
          description: |
            The ID of the request that caused the entry, when recorded.
            Quote it to Shorebird support to trace the request.
    AuditLogProduct:
      type: object
      description: OCSF `metadata.product`. Always Shorebird.
      required:
        - name
        - vendor_name
      properties:
        name:
          type: string
          description: Always `Shorebird`.
        vendor_name:
          type: string
          description: Always `Shorebird`.
    AuditLogApi:
      type: object
      description: OCSF `api`, the operation performed.
      required:
        - operation
      properties:
        operation:
          type: string
          description: |
            The event's name, such as `organization.rename`. The value the
            `operation` filter takes.
        token:
          $ref: '#/components/schemas/AuditLogApiToken'
    AuditLogApiToken:
      type: object
      description: |
        The API key (personal access token or service account key) the
        request was made with. Absent for other credentials.
      required:
        - uid
        - type_id
        - type
      properties:
        uid:
          type: string
          description: The key's ID, which revoking it takes.
        name:
          type: string
          description: The key's name when the entry was recorded.
        type_id:
          type: integer
          const: 7
          description: Always 7, OCSF's API Token.
        type:
          type: string
          const: API Token
          description: Always `API Token`.
    AuditLogActor:
      type: object
      description: OCSF `actor`, who caused the entry.
      required:
        - user
      properties:
        user:
          $ref: '#/components/schemas/AuditLogActorUser'
        session:
          $ref: '#/components/schemas/AuditLogSession'
    AuditLogActorUser:
      type: object
      description: |
        OCSF `actor.user`. A person is type 1 (`User`), a service account or
        a CI job acting as one is type 4 (`Service`), and Shorebird staff
        are type 99 (`shorebird_staff`) with no identity beyond that name.
      required:
        - type_id
        - type
      properties:
        uid:
          type: string
          description: The user's or service account's ID, as a string, when known.
        name:
          type: string
          description: The actor's name, when known.
        email_addr:
          type: string
          description: The actor's email, when known.
        type_id:
          type: integer
          description: 1 for a person, 4 for a service account, 99 for Shorebird staff.
        type:
          type: string
          enum:
            - User
            - Service
            - shorebird_staff
          description: The name of `type_id`.
    AuditLogSession:
      type: object
      description: |
        The console or OAuth sign-in session the request was made under.
        Absent for API keys.
      required:
        - uid
      properties:
        uid:
          type: string
          description: The session's ID (never its token), as a string.
        created_time:
          type: integer
          format: int64
          description: When the session began, in milliseconds since the Unix epoch.
        issuer:
          type: string
          description: The issuer of the identity the session's holder signed in with.
        is_mfa:
          type: boolean
          description: |
            Whether the sign-in used a second factor. Present only when the
            identity provider said; absent means unknown, not false.
    AuditLogSourceEndpoint:
      type: object
      description: |
        OCSF `src_endpoint`, where the request came from: `ip` when it was
        recorded, otherwise `name` set to `unknown`.
      properties:
        ip:
          type: string
          description: The client's IP address.
        name:
          type: string
          description: '`unknown`, when no IP address is given.'
    AuditLogHttpDetails:
      type: object
      description: OCSF `http_request`. Present when a user agent was recorded.
      required:
        - user_agent
      properties:
        user_agent:
          type: string
          description: The request's `User-Agent`.
    AuditLogResource:
      type: object
      description: OCSF `resources[]` entry, the thing the operation acted on.
      required:
        - type
        - uid
      properties:
        type:
          type: string
          description: What `uid` identifies, such as `organization` or `release`.
        uid:
          type: string
          description: The resource's ID.
    ServiceAccountRole:
      type: string
      description: |
        A role a service account can hold in its organization: a subset of
        `Role`. Never `admin` or `owner`, so a leaked key cannot manage the
        organization's members or its other service accounts.
      enum:
        - viewer
        - developer
        - appManager
        - auditor
      x-enum-descriptions:
        - Read-only access to the organization.
        - Can manage releases and patches.
        - Can manage apps, as well as releases and patches.
        - Can read the organization's audit log and nothing else.
    AppStoreConnectCredential:
      type: object
      description: |
        The App Store Connect team API key an organization gave Shorebird,
        without its private key.
      required:
        - id
        - organization_id
        - issuer_id
        - key_id
        - uploaded_by_user_id
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          description: The credential's ID.
        organization_id:
          type: integer
          format: int64
          description: The organization the key belongs to.
        issuer_id:
          type: string
          format: uuid
          description: The App Store Connect issuer id, in lowercase.
        key_id:
          type: string
          description: The App Store Connect key id.
        uploaded_by_user_id:
          type:
            - integer
            - 'null'
          format: int64
          description: The person who last uploaded the key, while they still exist.
        created_at:
          type: string
          format: date-time
          description: When the organization first gave Shorebird a key.
        updated_at:
          type: string
          format: date-time
          description: When the key was last uploaded.
    PutAppStoreConnectCredentialRequest:
      type: object
      required:
        - issuer_id
        - key_id
        - private_key
      properties:
        issuer_id:
          type: string
          format: uuid
          description: The issuer id App Store Connect shows above its team keys.
        key_id:
          type: string
          pattern: ^[A-Z0-9]{10}$
          description: The key id App Store Connect shows beside the key.
        private_key:
          type: string
          maxLength: 4096
          description: |
            The contents of the `.p8` file App Store Connect downloaded: a
            PEM P-256 private key beginning `-----BEGIN PRIVATE KEY-----`.
    ServiceAccount:
      type: object
      description: |
        A non-human account owned by an organization, for CI and other
        automation. It authenticates only with API keys issued to it or
        under OIDC trust rules, and is shown as `label` (`name[bot]`).
      required:
        - id
        - organization_id
        - name
        - label
        - role
        - created_at
        - created_by_user_id
        - created_by_email
        - last_auth_at
      properties:
        id:
          type: integer
          format: int64
          description: The service account's ID, which is also its user ID.
        organization_id:
          type: integer
          format: int64
          description: The organization that owns the service account.
        name:
          type: string
          description: The service account's name.
        label:
          type: string
          description: The name the service account is shown by, `name[bot]`.
        role:
          $ref: '#/components/schemas/ServiceAccountRole'
          description: The service account's role in its organization.
        created_at:
          type: string
          format: date-time
          description: When the service account was created.
        created_by_user_id:
          type:
            - integer
            - 'null'
          format: int64
          description: |
            The user who created the service account, or null once that user
            has been deleted.
        created_by_email:
          type:
            - string
            - 'null'
          description: |
            The email of the user who created the service account, or null
            once that user has been deleted.
        last_auth_at:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            When the service account last authenticated, or null if it never
            has. Refreshed at most once a day.
    GetServiceAccountsResponse:
      type: object
      description: The response body for GET /organizations/{organizationId}/service-accounts.
      required:
        - service_accounts
      properties:
        service_accounts:
          type: array
          items:
            $ref: '#/components/schemas/ServiceAccount'
          description: The organization's service accounts, oldest first.
        next_cursor:
          type: string
          description: |
            The opaque cursor of the next page; send it back as `cursor`
            to get that page.
            Present only when the request was paginated (sent `per_page`,
            `cursor` or `page`) and another page follows. Absent on the last
            page and on unpaginated responses.
        total_count:
          type: integer
          description: |
            How many items the whole list holds. Present only when the
            request was paginated.
    CreateServiceAccountRequest:
      type: object
      description: The request body for POST /organizations/{organizationId}/service-accounts.
      required:
        - name
      properties:
        name:
          type: string
          description: |
            The service account's name. Surrounding whitespace is trimmed;
            what remains must be 1 to 64 characters.
        role:
          $ref: '#/components/schemas/ServiceAccountRole'
          description: The service account's role. Defaults to `developer`.
    UpdateServiceAccountRequest:
      type: object
      description: |
        The request body for PATCH
        /organizations/{organizationId}/service-accounts/{serviceAccountId}.
      required:
        - role
      properties:
        role:
          $ref: '#/components/schemas/ServiceAccountRole'
          description: The service account's new role.
    ServiceAccountKey:
      type: object
      description: |
        An API key issued to a service account. Never carries the key's
        secret, which is returned only when the key is issued.
      required:
        - id
        - name
        - created_at
        - last_used_at
        - expires_at
        - scopes
      properties:
        id:
          type: integer
          format: int64
          description: The key's ID.
        name:
          type: string
          description: The key's name.
        created_at:
          type: string
          format: date-time
          description: When the key was issued.
        last_used_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the key was last used, or null if it never has been.
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the key expires, or null if it never does.
        scopes:
          type: array
          items:
            type: string
          description: |
            The key's scopes by wire name. A service account's key is issued
            with `api` and does what the account's role allows.
    GetServiceAccountKeysResponse:
      type: object
      description: |
        The response body for GET
        /organizations/{organizationId}/service-accounts/{serviceAccountId}/keys.
      required:
        - keys
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/ServiceAccountKey'
          description: The service account's unrevoked keys, newest first.
        next_cursor:
          type: string
          description: |
            The opaque cursor of the next page; send it back as `cursor`
            to get that page.
            Present only when the request was paginated (sent `per_page`,
            `cursor` or `page`) and another page follows. Absent on the last
            page and on unpaginated responses.
        total_count:
          type: integer
          description: |
            How many items the whole list holds. Present only when the
            request was paginated.
    CreateServiceAccountKeyRequest:
      type: object
      description: |
        The request body for POST
        /organizations/{organizationId}/service-accounts/{serviceAccountId}/keys.
        A body that includes `scope` is refused: a service account's key
        takes no scope of its own.
      required:
        - name
      properties:
        name:
          type: string
          description: |
            The key's name. Surrounding whitespace is trimmed; what remains
            must be 1 to 64 characters.
        expires_in_days:
          type:
            - integer
            - 'null'
          default: 365
          description: |
            How many days the key lasts, from 1 to 365. Omitted means 365.
            An explicit `null` issues a key that never expires.
    CreateServiceAccountKeyResponse:
      type: object
      description: |
        The response body for POST
        /organizations/{organizationId}/service-accounts/{serviceAccountId}/keys:
        the new key, plus its secret.
      required:
        - api_key
        - id
        - name
        - created_at
        - last_used_at
        - expires_at
        - scopes
      properties:
        api_key:
          type: string
          description: |
            The key's secret, an `sb_api_*` token to send as a bearer token.
            Returned only here: store it now, since no later call returns it.
        id:
          type: integer
          format: int64
          description: The key's ID.
        name:
          type: string
          description: The key's name.
        created_at:
          type: string
          format: date-time
          description: When the key was issued.
        last_used_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the key was last used; null for a new key.
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the key expires, or null if it never does.
        scopes:
          type: array
          items:
            type: string
          description: The key's scopes by wire name, `["api"]`.
    TrustRuleProvider:
      type: string
      description: The identity provider whose tokens an OIDC trust rule accepts.
      enum:
        - github
      x-enum-descriptions:
        - GitHub Actions OIDC tokens.
    GithubTrustRule:
      type: object
      description: |
        The GitHub Actions workflow an OIDC trust rule lets in. A token
        matches when its repository (ignoring case), owner id and workflow
        file match, and its environment and ref match when the rule names
        them.
      required:
        - repository_owner
        - repository_owner_id
        - repository_name
        - workflow_path
        - environment
        - ref_pattern
      properties:
        repository_owner:
          type: string
          description: The repository owner's GitHub login, as entered.
        repository_owner_id:
          type: integer
          format: int64
          description: |
            GitHub's numeric id for the repository owner, resolved when the
            rule was added and matched against the token's
            `repository_owner_id` claim.
        repository_name:
          type: string
          description: The repository's name, as entered.
        workflow_path:
          type: string
          description: |
            The workflow file, such as `.github/workflows/release.yml`,
            matched against the path in the token's `job_workflow_ref` claim.
        environment:
          type:
            - string
            - 'null'
          description: |
            The GitHub environment the job must run in, compared ignoring
            case, or null for any.
        ref_pattern:
          type:
            - string
            - 'null'
          description: |
            The ref the job must run on: exact (`refs/heads/main`), or a
            prefix ending in `*` (`refs/tags/*`). Null for any.
    ServiceAccountTrustRule:
      type: object
      description: |
        An OIDC trust rule: lets a CI workflow authenticate as a service
        account with a token from the CI provider's identity provider. The
        provider's own fields are under the provider's name.
      required:
        - id
        - provider
        - created_at
        - created_by_user_id
        - last_used_at
        - github
      properties:
        id:
          type: integer
          format: int64
          description: The trust rule's ID.
        provider:
          $ref: '#/components/schemas/TrustRuleProvider'
          description: The identity provider the rule accepts tokens from.
        created_at:
          type: string
          format: date-time
          description: When the rule was added.
        created_by_user_id:
          type:
            - integer
            - 'null'
          format: int64
          description: |
            The user who added the rule, or null once that user has been
            deleted.
        last_used_at:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            When a token was last exchanged under the rule, or null if never.
        github:
          $ref: '#/components/schemas/GithubTrustRule'
          description: The rule's GitHub fields, for the `github` provider.
    GetServiceAccountTrustRulesResponse:
      type: object
      description: |
        The response body for GET
        /organizations/{organizationId}/service-accounts/{serviceAccountId}/trust-rules.
      required:
        - trust_rules
      properties:
        trust_rules:
          type: array
          items:
            $ref: '#/components/schemas/ServiceAccountTrustRule'
          description: The service account's trust rules, oldest first.
        next_cursor:
          type: string
          description: |
            The opaque cursor of the next page; send it back as `cursor`
            to get that page.
            Present only when the request was paginated (sent `per_page`,
            `cursor` or `page`) and another page follows. Absent on the last
            page and on unpaginated responses.
        total_count:
          type: integer
          description: |
            How many items the whole list holds. Present only when the
            request was paginated.
    CreateServiceAccountTrustRuleRequest:
      type: object
      description: |
        The request body for POST
        /organizations/{organizationId}/service-accounts/{serviceAccountId}/trust-rules.
        Unlike `ServiceAccountTrustRule`, the GitHub fields sit at the top
        level rather than under `github`.
      required:
        - provider
        - repository_owner
        - repository_name
        - workflow_path
      properties:
        provider:
          $ref: '#/components/schemas/TrustRuleProvider'
          description: The identity provider; must be `github`.
        repository_owner:
          type: string
          description: |
            The login of the GitHub user or organization that owns the
            repository: letters, digits and hyphens, starting with a letter
            or digit, at most 39 characters
            (`^[A-Za-z0-9][A-Za-z0-9-]{0,38}$`). Must exist on GitHub; the
            server resolves it to its numeric id.
        repository_name:
          type: string
          description: |
            The repository's name: 1 to 100 letters, digits, `.`, `-` or
            `_` (`^[A-Za-z0-9._-]{1,100}$`), and neither `.` nor `..`.
        workflow_path:
          type: string
          description: |
            The workflow file, directly in `.github/workflows/` and ending
            `.yml` or `.yaml`, such as `.github/workflows/release.yml`. May
            not contain `..`.
        environment:
          type:
            - string
            - 'null'
          description: |
            The GitHub environment the job must run in: 1 to 255 characters,
            without surrounding spaces. Omitted or null accepts any
            environment.
        ref_pattern:
          type:
            - string
            - 'null'
          description: |
            The ref the job must run on, at most 255 characters: exact
            (`refs/heads/main`), or a prefix ending in a single `*`
            (`refs/tags/*`), with no other `*` and no whitespace. Omitted or
            null accepts any ref.
    UpdateAppRequest:
      type: object
      description: The request body for PATCH /apps/{appId}.
      required:
        - name
      properties:
        name:
          type: string
          description: |
            The new display name of the app: at least 1 and at most 256
            characters.
    AppCollaborator:
      type: object
      description: A user holding a per-app role on an app.
      required:
        - user_id
        - email
        - role
      properties:
        user_id:
          type: integer
          format: int64
          description: |
            The user's ID. This is the `collaboratorId` that
            PATCH and DELETE /apps/{appId}/collaborators/{collaboratorId}
            take.
        email:
          type: string
          format: email
          description: The user's email address.
        role:
          $ref: '#/components/schemas/Role'
          description: The user's role on the app.
