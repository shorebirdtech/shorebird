  /organizations:
    get:
      tags:
        - organizations
      summary: List organizations the current user is a member of.
      operationId: getOrganizationMemberships
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: The organizations the user is a member of.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrganizationsResponse'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
        - organizations
      summary: Create a team organization.
      description: |
        Creates a team organization owned by the signed-in user. Requires a
        plan with the collaboration feature (`shorebird_plan_insufficient_tier`
        otherwise). Service accounts cannot create organizations.
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: The newly-created organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          description: |
            The body could not be parsed (`organizations_create_error`), or
            the name is blank (`organization_name_blank`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            The caller is a service account (`service_account_forbidden`),
            or the caller's plan does not include collaboration
            (`shorebird_plan_insufficient_tier`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '424':
          description: |
            Creating the organization failed (`organizations_create_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
  /organizations/{organizationId}/apps:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags:
        - organizations
      summary: List apps in an organization.
      operationId: getOrganizationApps
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Page'
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: |
            Lists only the apps whose display name contains this text,
            ignoring case. Applied before paging, so `total_count` counts
            the matches.
        - name: platform
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ReleasePlatform'
          description: |
            Lists only the apps with a release on this platform: those whose
            `platforms` holds it. Applied before paging, as `q` is.
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - updated
              - created
              - name
            default: updated
          description: What the apps are ordered by, before paging.
        - name: direction
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
          description: |
            The order of `sort`. Defaults to `asc` for `name` and to `desc`
            otherwise, as GitHub's lists do.
      responses:
        '200':
          description: The apps belonging to the organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrganizationAppsResponse'
        '400':
          description: |
            The cursor is invalid (`invalid_cursor`), both `cursor` and
            `page` were sent (`invalid_page`), `sort` or `direction`
            is not one the list knows (`invalid_sort`), or `platform` is not
            a release platform (`invalid_platform`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
        - organizations
      summary: Move an app into this organization.
      description: |
        Transfers the app named in the body from the organization it is in
        now to the organization in the path. Requires the
        `organizationApps.transfer` permission, which the `admin` and
        `owner` roles hold, in both organizations.
      operationId: transferOrganizationApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferOrganizationAppRequest'
      responses:
        '204':
          description: The app was moved.
        '400':
          description: |
            The organization id is not an integer
            (`organization_id_malformed`), or the body could not be parsed
            (`organization_transfer_app_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            The caller lacks `organizationApps.transfer` in this
            organization or in the app's current one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            No such organization, or the caller is not a member of it
            (`organization_membership_guard_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '424':
          description: |
            Looking up the app's current organization, or moving it, failed
            (`organization_transfer_app_error`). An app id that does not
            exist is reported this way too.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
  /organizations/{organizationId}/users:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags:
        - organizations
      summary: List users in an organization.
      operationId: getOrganizationUsers
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: The users belonging to the organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrganizationUsersResponse'
        default:
          $ref: '#/components/responses/Error'
  /organizations/{organizationId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags:
        - organizations
      summary: Get an organization and the caller's role in it.
      description: |
        Requires the `organizations.view` permission, which every role
        except `auditor` holds. A collaborator who holds a role only on some
        of the organization's apps (role `none`) is refused.
      operationId: getOrganization
      responses:
        '200':
          description: The organization and the caller's role in it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMembership'
        '400':
          description: The organization id is not an integer (`organization_id_malformed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller lacks the `organizations.view` permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            No such organization, or the caller is not a member of it
            (`organization_membership_guard_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags:
        - organizations
      summary: Rename an organization.
      description: |
        Requires the `organizations.update` permission, which the `admin`
        and `owner` roles hold.
      operationId: updateOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '204':
          description: The organization was renamed.
        '400':
          description: |
            The organization id is not an integer
            (`organization_id_malformed`), the body could not be parsed
            (`organization_patch_error`), or the name is blank
            (`organization_name_blank`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller lacks the `organizations.update` permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            No such organization, or the caller is not a member of it
            (`organization_membership_guard_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '424':
          description: |
            Renaming the organization failed (`organization_patch_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
        - organizations
      summary: Delete a team organization and all of its apps.
      description: |
        Permanently deletes the organization and every app in it, with each
        app's releases, patches and stored artifacts. This cannot be undone.
        Personal organizations cannot be deleted.

        An organization that has apps cannot be deleted while its owner has
        a billable Shorebird subscription: cancel the subscription first.
        An organization with no apps can always be deleted.

        If a step fails partway, apps already deleted stay deleted and the
        organization remains; retrying finishes the job.

        Requires the `organizations.delete` permission, which only the
        `owner` role holds.
      operationId: deleteOrganization
      responses:
        '204':
          description: The organization and its apps were deleted.
        '400':
          description: The organization id is not an integer (`organization_id_malformed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            The caller lacks the `organizations.delete` permission, or the
            organization is a personal one (`organization_delete_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            No such organization, or the caller is not a member of it
            (`organization_membership_guard_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            The organization has apps and its billing account has a billable
            subscription
            (`organization_delete_blocked_by_active_subscription`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '424':
          description: |
            A database, storage or billing step failed
            (`organization_patch_error` or `organization_delete_error`).
            Apps deleted before the failure are not restored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
  /organizations/{organizationId}/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/OrganizationUserId'
    patch:
      tags:
        - organizations
      summary: Change a member's role.
      description: |
        Sets the member's role in a team organization. Requires the
        `organizationMembers.update` permission, which the `admin` and
        `owner` roles hold.

        Setting `owner` transfers ownership: only the current owner may do
        it, and it also requires `organizations.transfer`. Only the owner
        may change the owner's own role. Roles other than `developer` must
        be offered by the organization's plan
        (`shorebird_plan_insufficient_tier` otherwise).
      operationId: updateOrganizationUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationUserRequest'
      responses:
        '204':
          description: The member's role was changed.
        '400':
          description: |
            The organization id is not an integer
            (`organization_id_malformed`), the user id is not an integer
            (`organization_users_error`), or the body could not be parsed
            (`organizations_users_update_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            The caller lacks a required permission, the organization is
            personal, a non-owner tried to change the owner's role or to
            transfer ownership (`organizations_users_update_error`), or the
            plan does not offer the role (`shorebird_plan_insufficient_tier`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            No such organization or the caller is not a member of it
            (`organization_membership_guard_error`), or the user is not a
            member (`organizations_users_update_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '424':
          description: |
            Reading the member's role or the plan, or changing the role,
            failed (`organizations_users_update_error` or
            `shorebird_plan_lookup_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
        - organizations
      summary: Remove a member from an organization.
      description: |
        Requires the `organizationMembers.delete` permission, which the
        `admin` and `owner` roles hold. The owner cannot be removed.
      operationId: deleteOrganizationUser
      responses:
        '204':
          description: The member was removed.
        '400':
          description: |
            The organization id is not an integer
            (`organization_id_malformed`), or the user id is not an integer
            (`organization_users_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            The caller lacks the `organizationMembers.delete` permission, or
            the user is the owner (`organizations_users_delete_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            No such organization or the caller is not a member of it
            (`organization_membership_guard_error`), or the user is not a
            member (`organizations_users_delete_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '424':
          description: |
            Reading the member's role or removing them failed
            (`organizations_users_delete_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
  /organizations/{organizationId}/invitations:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags:
        - organizations
      summary: List an organization's pending invitations.
      description: |
        Invitations to join the organization that are still pending, most
        recently sent first. Accepted, declined, revoked and expired
        invitations are left out. Requires the `invitations.view`
        permission, which every role except `auditor` holds.
      operationId: getOrganizationInvitations
      parameters:
        - $ref: '#/components/parameters/PerPage'
          description: |
            The number of invitations per page. This list always pages:
            without `per_page` a page holds 30. Values above 100 are
            treated as 100; values that are not a positive integer are
            treated as 30.
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of the organization's pending invitations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInvitationsResponse'
        '400':
          description: |
            The organization id is not an integer
            (`organization_id_malformed`), or the cursor is unreadable
            (`invalid_cursor`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller lacks the `invitations.view` permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            No such organization, or the caller is not a member of it
            (`organization_membership_guard_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '424':
          description: |
            Listing the invitations failed
            (`organization_invitations_get_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
        - organizations
      summary: Invite someone to join an organization.
      description: |
        Emails an invitation to join the team organization with the given
        role. The invitation is valid for 14 days; the invitee accepts it
        with `POST /invitations/{invitationId}/accept`. Requires the
        `invitations.create` permission, which the `admin` and `owner`
        roles hold.

        The `owner` role cannot be granted by invitation. Inviting anyone
        needs the organization's plan to include collaboration, and roles
        other than `developer` must be offered by that plan. When the
        organization restricts members to allowed email domains, the email
        must be in one of them. An organization holds at most 50 pending
        invitations.

        When the organization belongs to an enterprise and the email is an
        account already in that enterprise's directory, no invitation is
        sent: the account is added as a member at the role at once, and the
        response's `type` is `member` rather than `invitation`.
      operationId: createOrganizationInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationInvitationRequest'
      responses:
        '201':
          description: |
            The invitation was created and sent (`type` `invitation`), or the
            account, being in the directory of the organization's
            enterprise, was added as a member (`type` `member`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CreateInvitationResponse'
                  - $ref: '#/components/schemas/AddedMemberResponse'
                discriminator:
                  propertyName: type
                  mapping:
                    invitation: '#/components/schemas/CreateInvitationResponse'
                    member: '#/components/schemas/AddedMemberResponse'
        '400':
          description: |
            The organization id is not an integer
            (`organization_id_malformed`), or the body could not be parsed
            (`organization_invitations_create_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            The caller lacks the `invitations.create` permission; the role
            is `owner`, or the email's domain is not allowed
            (`organization_invitations_create_error`); or the
            organization's plan does not include collaboration, or does not
            offer the role
            (`shorebird_plan_insufficient_tier`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            No such organization, or the caller is not a member of it
            (`organization_membership_guard_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            The invitee is already a member
            (`organization_invitations_already_member`), or an invitation
            to this email is already pending
            (`organization_invitations_already_pending`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '424':
          description: |
            Reading the plan, the allowed domains or the membership, or
            creating the invitation, failed
            (`organization_invitations_create_error` or
            `shorebird_plan_lookup_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: |
            The organization already has 50 pending invitations
            (`organization_invitations_cap_reached`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
  /organizations/{organizationId}/invitations/{invitationId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/InvitationId'
    delete:
      tags:
        - organizations
      summary: Revoke a pending invitation to an organization.
      description: |
        Requires the `invitations.revoke` permission, which the `admin` and
        `owner` roles hold.
      operationId: revokeOrganizationInvitation
      responses:
        '204':
          description: The invitation was revoked.
        '400':
          description: The organization id is not an integer (`organization_id_malformed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller lacks the `invitations.revoke` permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            No such organization or the caller is not a member of it
            (`organization_membership_guard_error`), or no such invitation
            to this organization (`organization_invitation_not_found`). An
            invitation id that is not a UUID is also a `404`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            The invitation was already accepted, declined, revoked, or has
            expired (`organization_invitation_revoke_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '424':
          description: |
            Reading the invitation failed
            (`organization_invitation_error`), or revoking it failed
            (`organization_invitation_revoke_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
  /organizations/{organizationId}/plan:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags:
        - billing
      summary: Get the plan an organization is on.
      description: |
        The plan belongs to the organization's billing account, so its
        install credit and overage limit are the account's, whoever asks. An
        organization with no billing account is on the free plan, with no
        credit and overages off. Requires the
        `plans.view` permission in the organization, which every role
        except `auditor` holds, or, for a collaborator with role `none`, a
        role on any of the organization's apps.
      operationId: getOrganizationPlan
      responses:
        '200':
          description: The organization's plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          description: The organization id is not an integer (`organization_id_malformed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller lacks the `plans.view` permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            No such organization, or the caller is not a member of it
            (`organization_membership_guard_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '424':
          description: |
            The organization's billing account could not be looked up
            (`organization_lookup_error`). A failure to reach the billing
            provider is not an error: the plan falls back to the free plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
  /organizations/{organizationId}/usage:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags:
        - billing
      summary: Get patch-install usage for the organization's owner.
      description: |
        Patch installs this allotment period, and where the account stands
        against its plan. The plan, install credit and overage limit are
        the organization's billing account's, and the position counts every
        app in every organization the organization's owner owns.
        The apps listed are that full set only when the caller is the owner;
        any other member sees only this organization's apps. Requires the
        `plans.view` permission, which every role except `auditor` holds.
      operationId: getOrganizationUsage
      responses:
        '200':
          description: The owner's usage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUsageResponse'
        '400':
          description: The organization id is not an integer (`organization_id_malformed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller lacks the `plans.view` permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            No such organization, or the caller is not a member of it
            (`organization_membership_guard_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '424':
          description: |
            Looking up the owner, their subscription, their apps or their
            install counts failed (`organization_usage_get_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
  /organizations/{organizationId}/audit-logs:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags:
        - organizations
      summary: Read an organization's audit log.
      description: |
        Who did what in the organization, as OCSF 1.9.0 API Activity events
        (class 6003), so a SIEM can ingest it without a Shorebird-specific
        pipeline.

        The log always pages. Newest first (the default), `next_cursor` is
        present while older entries remain. Oldest first (`order=asc`),
        `next_cursor` is always present, so a poller can resume from where
        it stopped: entries younger than 60 seconds are held back until they
        settle, and a page with no entries echoes the cursor it was sent.

        Requires the plan's audit-log feature
        (`shorebird_plan_insufficient_tier` otherwise) and the
        `auditLogs.view` permission, which the `admin`, `owner` and
        `auditor` roles hold.
      operationId: getOrganizationAuditLogs
      parameters:
        - $ref: '#/components/parameters/PerPage'
          description: |
            The number of entries per page. This list always pages: without
            `per_page` a page holds 30. Values above 100 are treated as 100;
            values that are not a positive integer are treated as 30.
        - $ref: '#/components/parameters/Cursor'
        - name: order
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AuditLogOrder'
          description: The order entries are listed in. Defaults to `desc`.
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Only entries at or after this time (ISO 8601, inclusive).
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Only entries at or before this time (ISO 8601, inclusive).
        - name: appId
          in: query
          required: false
          schema:
            type: string
          description: Only entries about this app.
        - name: actorId
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: |
            Only entries this user or service account caused. Never matches
            an entry Shorebird staff caused.
        - name: operation
          in: query
          required: false
          schema:
            type: string
          description: |
            Only entries of this event, named as in an entry's
            `api.operation` (for example `organization.rename`). A name
            that is not an audit event is a `400`.
      responses:
        '200':
          description: One page of audit log entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrganizationAuditLogsResponse'
        '400':
          description: |
            The organization id is not an integer
            (`organization_id_malformed`), the cursor is unreadable
            (`invalid_cursor`), or a filter is malformed
            (`audit_log_bad_request`, with the reason in `details`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            The caller lacks the `auditLogs.view` permission, or the plan
            does not include audit logs (`shorebird_plan_insufficient_tier`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            No such organization, or the caller is not a member of it
            (`organization_membership_guard_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '424':
          description: |
            The organization's billing account could not be looked up
            (`organization_lookup_error`), or reading the log failed
            (`audit_log_fetch_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
  /organizations/{organizationId}/app-store-connect-credential:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags:
        - app-store-connect
      summary: Get the organization's App Store Connect key.
      description: |
        The ids of the App Store Connect key the organization gave Shorebird.
        Never includes the private key.

        Requires the `storeCredentials.view` permission, which only
        the `admin` and `owner` roles hold.
      operationId: getAppStoreConnectCredential
      responses:
        '200':
          description: The organization's App Store Connect key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppStoreConnectCredential'
        '400':
          description: The organization id is not an integer (`organization_id_malformed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller lacks the `storeCredentials.view` permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            No such organization or the caller is not a member of it
            (`organization_membership_guard_error`), or the organization has
            no App Store Connect key (`app_store_connect_credential_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '424':
          description: |
            A database read failed (`app_store_connect_credential_database_error`,
            or `organization_membership_guard_error` while checking membership).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
    put:
      tags:
        - app-store-connect
      summary: Set the organization's App Store Connect key.
      description: |
        Stores an App Store Connect team API key for the organization,
        replacing any it had. Create the key in App Store Connect under Users
        and Access, Integrations, Team Keys, with the narrowest role the
        integration needs.

        The key is checked with App Store Connect first, by listing one of
        the team's apps, and stored only if Apple accepts it. The private key
        is encrypted before it is stored and is never returned.

        Requires the `storeCredentials.update` permission, which
        only the `admin` and `owner` roles hold. Personal access tokens and
        federated (OIDC-exchanged) tokens are refused whatever their role:
        sign in to the console instead.
      operationId: putAppStoreConnectCredential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutAppStoreConnectCredentialRequest'
      responses:
        '200':
          description: The organization's key, replacing any it had.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppStoreConnectCredential'
        '400':
          description: |
            The organization id is not an integer
            (`organization_id_malformed`); the body is not a JSON object, or a
            field is missing or malformed
            (`app_store_connect_credential_bad_request`, with the reason in
            `details`); or App Store Connect refused the key, or accepted it
            but its role cannot read the team's apps
            (`app_store_connect_key_rejected`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            The caller lacks the `storeCredentials.update`
            permission, or authenticated with a personal access token or a
            federated token, which may never set the key
            (`personal_access_token_forbidden` or
            `api_key_insufficient_permissions`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            No such organization, or the caller is not a member of it
            (`organization_membership_guard_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '424':
          description: |
            Encrypting the key failed
            (`app_store_connect_credential_encryption_error`), or a database
            step failed (`app_store_connect_credential_database_error`, or
            `organization_membership_guard_error` while checking membership).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: |
            App Store Connect could not be reached to check the key
            (`app_store_connect_unavailable`), or this server cannot store
            App Store Connect keys
            (`app_store_connect_credentials_not_configured`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
        - app-store-connect
      summary: Remove the organization's App Store Connect key.
      description: |
        Deletes the key, so Shorebird can no longer call App Store Connect
        for the organization. The key still works until it is revoked in App
        Store Connect, which Shorebird cannot do.

        Requires the `storeCredentials.delete` permission, which
        only the `admin` and `owner` roles hold. Personal access tokens and
        federated (OIDC-exchanged) tokens are refused whatever their role.
      operationId: deleteAppStoreConnectCredential
      responses:
        '204':
          description: The key was removed.
        '400':
          description: The organization id is not an integer (`organization_id_malformed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            The caller lacks the `storeCredentials.delete`
            permission, or authenticated with a personal access token or a
            federated token, which may never remove the key
            (`personal_access_token_forbidden` or
            `api_key_insufficient_permissions`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            No such organization or the caller is not a member of it
            (`organization_membership_guard_error`), or the organization has
            no App Store Connect key (`app_store_connect_credential_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '424':
          description: |
            A database step failed (`app_store_connect_credential_database_error`,
            or `organization_membership_guard_error` while checking membership).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
  /organizations/{organizationId}/service-accounts:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags:
        - service-accounts
      summary: List the organization's service accounts.
      description: |
        Every service account the organization owns, oldest first.

        Requires the `serviceAccounts.view` permission, which only the
        `admin` and `owner` roles hold.
      operationId: getServiceAccounts
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: The organization's service accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetServiceAccountsResponse'
        '400':
          description: The organization id is not an integer (`organization_id_malformed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller lacks the `serviceAccounts.view` permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            No such organization, or the caller is not a member of it
            (`organization_membership_guard_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '424':
          description: |
            A database read failed (`service_account_database_error`, or
            `organization_membership_guard_error` while checking membership).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
        - service-accounts
      summary: Create a service account.
      description: |
        Creates a service account in the organization with the given role
        (`developer` when omitted). Service accounts may hold any of their
        roles on every plan. A new account has no keys or trust rules; issue
        it a key with `POST .../keys`, or let a CI workflow sign in as it
        with `POST .../trust-rules`.

        Requires the `serviceAccounts.create` permission, which only the
        `admin` and `owner` roles hold. Personal access tokens and federated
        (OIDC-exchanged) tokens are refused whatever their role
        (`personal_access_token_forbidden` or
        `api_key_insufficient_permissions`): sign in to the console instead.
      operationId: createServiceAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceAccountRequest'
      responses:
        '201':
          description: The newly-created service account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccount'
        '400':
          description: |
            The organization id is not an integer
            (`organization_id_malformed`), or the body is not a JSON object,
            `name` is missing or invalid, or `role` names a role a service
            account may not hold (`service_account_bad_request`, with the
            reason in `details`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            The caller lacks the `serviceAccounts.create` permission, or
            authenticated with a credential that may never manage service
            accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            No such organization, or the caller is not a member of it
            (`organization_membership_guard_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '424':
          description: A database step failed (`service_account_database_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
  /organizations/{organizationId}/service-accounts/{serviceAccountId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ServiceAccountId'
    patch:
      tags:
        - service-accounts
      summary: Change a service account's role.
      description: |
        Sets the service account's role, the one property of it that
        changes. Its keys and trust rules then act with the new role. The
        change is audited even when the role is unchanged.

        Requires the `serviceAccounts.update` permission, which only the
        `admin` and `owner` roles hold. Personal access tokens and federated
        tokens are refused whatever their role.
      operationId: updateServiceAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServiceAccountRequest'
      responses:
        '200':
          description: The service account, with its new role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccount'
        '400':
          description: |
            The organization id is not an integer
            (`organization_id_malformed`), or the service account id is not
            an integer, the body is not a JSON object, or `role` is missing
            or names a role a service account may not hold
            (`service_account_bad_request`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            The caller lacks the `serviceAccounts.update` permission, or
            authenticated with a credential that may never manage service
            accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            No such organization or the caller is not a member of it
            (`organization_membership_guard_error`), or the organization has
            no service account with that id (`service_account_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '424':
          description: A database step failed (`service_account_database_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
        - service-accounts
      summary: Delete a service account.
      description: |
        Permanently deletes the service account. Its API keys and trust
        rules go with it, so any CI using them stops authenticating. This
        cannot be undone.

        Requires the `serviceAccounts.delete` permission, which only the
        `admin` and `owner` roles hold. Personal access tokens and federated
        tokens are refused whatever their role.
      operationId: deleteServiceAccount
      responses:
        '204':
          description: The service account was deleted.
        '400':
          description: |
            The organization id (`organization_id_malformed`) or the service
            account id (`service_account_bad_request`) is not an integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            The caller lacks the `serviceAccounts.delete` permission, or
            authenticated with a credential that may never manage service
            accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            No such organization or the caller is not a member of it
            (`organization_membership_guard_error`), or the organization has
            no service account with that id (`service_account_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '424':
          description: A database step failed (`service_account_database_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
  /organizations/{organizationId}/service-accounts/{serviceAccountId}/keys:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ServiceAccountId'
    get:
      tags:
        - service-accounts
      summary: List a service account's API keys.
      description: |
        The service account's keys that have not been revoked, newest first.
        Keys past their `expires_at` are still listed until revoked. A key's
        secret is never returned here: it is shown once, when the key is
        issued.

        Requires the `serviceAccountKeys.view` permission, which only the
        `admin` and `owner` roles hold.
      operationId: getServiceAccountKeys
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: The service account's unrevoked keys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetServiceAccountKeysResponse'
        '400':
          description: |
            The organization id (`organization_id_malformed`) or the service
            account id (`service_account_bad_request`) is not an integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller lacks the `serviceAccountKeys.view` permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            No such organization or the caller is not a member of it
            (`organization_membership_guard_error`), or the organization has
            no service account with that id (`service_account_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '424':
          description: A database read failed (`service_account_database_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
        - service-accounts
      summary: Issue an API key to a service account.
      description: |
        Mints a new `sb_api_*` key for the service account and returns its
        secret in `api_key`. The secret is shown only in this response;
        store it now, since no later call returns it.

        A key does what the service account's role allows and takes no
        scope of its own; a body that names `scope` is refused. It lasts 365
        days unless `expires_in_days` says otherwise, and never expires only
        when `expires_in_days` is explicitly `null`.

        Requires the `serviceAccountKeys.create` permission, which only the
        `admin` and `owner` roles hold. Personal access tokens and federated
        tokens are refused whatever their role.
      operationId: createServiceAccountKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceAccountKeyRequest'
      responses:
        '201':
          description: The new key, including its secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateServiceAccountKeyResponse'
        '400':
          description: |
            The organization id is not an integer
            (`organization_id_malformed`), or the service account id is not
            an integer, the body is not a JSON object, `name` is missing or
            invalid, `expires_in_days` is out of range, or the body names a
            `scope` (`service_account_bad_request`, with the reason in
            `details`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            The caller lacks the `serviceAccountKeys.create` permission, or
            authenticated with a credential that may never manage service
            accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            No such organization or the caller is not a member of it
            (`organization_membership_guard_error`), or the organization has
            no service account with that id (`service_account_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '424':
          description: A database step failed (`service_account_database_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
  /organizations/{organizationId}/service-accounts/{serviceAccountId}/keys/{keyId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ServiceAccountId'
      - $ref: '#/components/parameters/ServiceAccountKeyId'
    delete:
      tags:
        - service-accounts
      summary: Revoke a service account's API key.
      description: |
        Revokes the key, which stops authenticating at once. The key's
        record is kept but no longer listed. Revoking a key that is already
        revoked is a `404`.

        Requires the `serviceAccountKeys.revoke` permission, which only the
        `admin` and `owner` roles hold. Personal access tokens and federated
        tokens are refused whatever their role.
      operationId: revokeServiceAccountKey
      responses:
        '204':
          description: The key was revoked.
        '400':
          description: |
            The organization id (`organization_id_malformed`), or the service
            account or key id (`service_account_bad_request`), is not an
            integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            The caller lacks the `serviceAccountKeys.revoke` permission, or
            authenticated with a credential that may never manage service
            accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            No such organization or the caller is not a member of it
            (`organization_membership_guard_error`), the organization has no
            service account with that id (`service_account_not_found`), or
            the service account has no unrevoked key with that id
            (`service_account_key_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '424':
          description: A database step failed (`service_account_database_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
  /organizations/{organizationId}/service-accounts/{serviceAccountId}/trust-rules:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ServiceAccountId'
    get:
      tags:
        - service-accounts
      summary: List a service account's OIDC trust rules.
      description: |
        The trust rules that let a CI workflow authenticate as the service
        account with a token from its own identity provider, oldest first.
        Listing needs no particular plan, so an organization that moves to a
        plan without OIDC federation still sees the rules it has.

        Requires the `serviceAccountTrustRules.view` permission, which only
        the `admin` and `owner` roles hold.
      operationId: getServiceAccountTrustRules
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: The service account's trust rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetServiceAccountTrustRulesResponse'
        '400':
          description: |
            The organization id (`organization_id_malformed`) or the service
            account id (`service_account_bad_request`) is not an integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller lacks the `serviceAccountTrustRules.view` permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            No such organization or the caller is not a member of it
            (`organization_membership_guard_error`), or the organization has
            no service account with that id (`service_account_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '424':
          description: A database read failed (`service_account_database_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
        - service-accounts
      summary: Add an OIDC trust rule to a service account.
      description: |
        Lets jobs of one GitHub Actions workflow authenticate as the service
        account by exchanging their GitHub OIDC token, so no long-lived key
        has to be stored in CI. `github` is the only provider.

        The rule matches a token from the named repository and workflow
        file, optionally only in one environment and only on matching refs.
        The server looks up `repository_owner` on GitHub and stores the
        owner's numeric id, which the token's `repository_owner_id` claim
        must match, so a deleted owner name registered again by someone else
        does not inherit the trust.

        Adding a rule requires a plan with OIDC federation (Business or
        Enterprise). Requires the `serviceAccountTrustRules.create`
        permission, which only the `admin` and `owner` roles hold. Personal
        access tokens and federated tokens are refused whatever their role.
      operationId: createServiceAccountTrustRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceAccountTrustRuleRequest'
      responses:
        '201':
          description: The newly-added trust rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountTrustRule'
        '400':
          description: |
            The organization id is not an integer
            (`organization_id_malformed`); the service account id is not an
            integer, the body is not a JSON object, or a field fails
            validation (`service_account_bad_request`, with the reason in
            `details`); or no GitHub user or organization has the name in
            `repository_owner` (`github_owner_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            The organization's plan does not include OIDC federation
            (`shorebird_plan_insufficient_tier`), the caller lacks the
            `serviceAccountTrustRules.create` permission, or the caller
            authenticated with a credential that may never manage service
            accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            No such organization or the caller is not a member of it
            (`organization_membership_guard_error`), or the organization has
            no service account with that id (`service_account_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            The service account already has a trust rule for the same
            repository, workflow, environment and ref pattern
            (`service_account_trust_rule_exists`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '424':
          description: |
            A database step failed (`service_account_database_error`), or the
            organization's billing account could not be looked up to read its
            plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: |
            GitHub could not be reached, or is rate limiting lookups, so the
            repository owner could not be resolved (`github_unavailable`).
            Try again in a few minutes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
  /organizations/{organizationId}/service-accounts/{serviceAccountId}/trust-rules/{ruleId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ServiceAccountId'
      - $ref: '#/components/parameters/TrustRuleId'
    delete:
      tags:
        - service-accounts
      summary: Remove an OIDC trust rule from a service account.
      description: |
        Deletes the trust rule, so the workflow it named can no longer
        authenticate as the service account. Needs no particular plan.

        Requires the `serviceAccountTrustRules.delete` permission, which
        only the `admin` and `owner` roles hold. Personal access tokens and
        federated tokens are refused whatever their role.
      operationId: deleteServiceAccountTrustRule
      responses:
        '204':
          description: The trust rule was removed.
        '400':
          description: |
            The organization id (`organization_id_malformed`), or the service
            account or trust rule id (`service_account_bad_request`), is not
            an integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            The caller lacks the `serviceAccountTrustRules.delete`
            permission, or authenticated with a credential that may never
            manage service accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            No such organization or the caller is not a member of it
            (`organization_membership_guard_error`), the organization has no
            service account with that id (`service_account_not_found`), or
            the service account has no trust rule with that id
            (`service_account_trust_rule_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '424':
          description: A database step failed (`service_account_database_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
  /diagnostics/gcp_upload:
    get:
      tags:
        - diagnostics
      summary: Get a GCP upload link for measuring upload speed.
      operationId: getGcpUploadSpeedTestUrl
      description: |
        Needs no authentication: `shorebird doctor` calls it to diagnose
        exactly the cases where signing in or uploading fails.
      security: []
      responses:
        '200':
          description: The upload URL to measure against.
          content:
            application/json:
              schema:
                type: object
                description: The upload URL to measure against.
                required:
                  - upload_url
                properties:
                  upload_url:
                    type: string
                    description: The GCP-signed upload URL.
        default:
          $ref: '#/components/responses/Error'
  /diagnostics/gcp_download:
    get:
      tags:
        - diagnostics
      summary: Get a GCP download link for measuring download speed.
      operationId: getGcpDownloadSpeedTestUrl
      description: |
        Needs no authentication: `shorebird doctor` calls it to diagnose
        exactly the cases where signing in or uploading fails.
      security: []
      responses:
        '200':
          description: The download URL to measure against.
          content:
            application/json:
              schema:
                type: object
                description: The download URL to measure against.
                required:
                  - download_url
                properties:
                  download_url:
                    type: string
                    description: The GCP-signed download URL.
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: |
        **Recommended.** An `sb_api_*` API key minted in the Shorebird
        console (Account > API Keys). Long-lived, no refresh needed.
    oauthJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A JWT access token obtained via Shorebird's interactive OAuth
        login flow (`shorebird login`). Short-lived (15 min),
        auto-refreshed by the CLI using a stored refresh token.
  responses:
    Error:
      description: |
        Standard error response. Emitted for any non-2xx status where a
        body can be decoded into an [ErrorResponse].
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  parameters:
    AppId:
      name: appId
      in: path
      required: true
      schema:
        type: string
      description: The ID of the app.
    ReleaseId:
      name: releaseId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: The ID of the release.
    PatchId:
      name: patchId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: The ID of the patch.
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: The ID of the organization.
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The ID of the invitation.
    OrganizationUserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: The ID of the member, a user in the organization.
    ServiceAccountId:
      name: serviceAccountId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: |
        The ID of the service account (its user ID). A value that is not an
        integer is a `400` (`service_account_bad_request`).
    ServiceAccountKeyId:
      name: keyId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: |
        The ID of the service account's API key. A value that is not an
        integer is a `400` (`service_account_bad_request`).
    TrustRuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: |
        The ID of the trust rule. A value that is not an integer is a `400`
        (`service_account_bad_request`).
    ChannelId:
      name: channelId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: The ID of the channel.
    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
      description: |
        The number of items per page. Sending `per_page` (or `cursor`)
        opts in to pagination: the response holds one page and, unless it
        is the last, a `next_cursor` body field. Without either, the full
        list is returned with no `next_cursor`. Values above 100 are
        treated as 100; values that are not a positive integer are treated
        as 30.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: |
        The `next_cursor` of the previous page, which this page starts
        after. Send it with the same other query parameters as the
        previous request. It is opaque: do not build or parse it. An
        unreadable cursor is a `400`.
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: |
        The 1-based number of the page to return, on a list whose response
        carries `total_count`. Like `per_page`, sending it opts in to
        pagination. Send either `page` or `cursor`, not both (`400`,
        `invalid_page`). A value that is not a positive integer reads the
        first page.
  schemas:
    App:
      type: object
      description: The application downloaded and run on various devices/platforms.
      required:
        - id
        - display_name
      properties:
        id:
          type: string
          description: The ID of the app.
        display_name:
          type: string
          description: The display name of the app.
    AppMetadata:
      type: object
      description: A single app which contains zero or more releases.
      required:
        - app_id
        - display_name
        - created_at
        - updated_at
      properties:
        app_id:
          type: string
          description: The ID of the app.
        organization_id:
          type: integer
          format: int64
          description: |
            The ID of the organization the app belongs to. Every app
            belongs to exactly one organization and the server always
            sends this; it is optional only so that clients tolerate
            servers that predate it.
        display_name:
          type: string
          description: The display name of the app.
        latest_release_version:
          type: string
          description: The latest release version of the app.
        latest_patch_number:
          type: integer
          format: int64
          description: The latest patch number of the app.
        created_at:
          type: string
          format: date-time
          description: The date and time the app was created.
        updated_at:
          type: string
          format: date-time
          description: The date and time the app was last updated.
        platforms:
          type: array
          description: |
            Every platform the app has shipped to (i.e. has at least one
            release artifact for). Independent of `latest_releases`:
            an app can list a platform here even if no release on that
            platform has been analyzed yet.
          items:
            $ref: '#/components/schemas/ReleasePlatform'
        latest_releases:
          type: object
          description: |
            The latest analyzed release per platform. A platform is
            omitted when no release for that platform has been analyzed
            yet. When the latest release for a platform is not yet
            analyzed but a previous one is, the previous release is
            returned here and `pending_releases.{platform}` identifies
            the unanalyzed newer release.
          additionalProperties:
            $ref: '#/components/schemas/LatestRelease'
          propertyNames:
            $ref: '#/components/schemas/ReleasePlatform'
        pending_releases:
          type: object
          description: |
            The newest unanalyzed release per platform, whenever one
            exists. A platform is omitted when its most recent release
            has already been analyzed. Independent of `latest_releases`:
            both can be present (a newer release than the analyzed one
            is being processed) or only `pending_releases` can be
            present (no release on the platform has been analyzed yet).
          additionalProperties:
            $ref: '#/components/schemas/PendingRelease'
          propertyNames:
            $ref: '#/components/schemas/ReleasePlatform'
        icon_url:
          type: string
          description: |
            Server-emitted URL for the app's launcher icon, sourced from
            the most recent analyzed iOS release (or Android, when iOS
            has no analyzed release with an icon). Requires the same
            auth as the rest of the apps API. The URL embeds a digest
            of the icon as a `v` query parameter so it can be cached
            indefinitely; a release that leaves the icon unchanged
            leaves the URL unchanged too. Omitted when no analyzed
            release has an icon.
    Channel:
      type: object
      description: |
        A tag used to manage the subset of installs that receive a patch.
        By default a "stable" channel is created and used by devices to
        query for available patches.
      required:
        - id
        - app_id
        - name
      properties:
        id:
          type: integer
          format: int64
          description: The ID of the channel.
        app_id:
          type: string
          description: The ID of the app.
        name:
          type: string
          description: The channel name.
    Release:
      type: object
      description: |
        A release build of an application that is distributed to devices.
        A release can have zero or more patches applied to it.
      required:
        - id
        - app_id
        - version
        - flutter_revision
        - platforms
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          description: The ID of the release.
        app_id:
          type: string
          description: The ID of the app.
        version:
          type: string
          description: The version of the release.
        flutter_revision:
          type: string
          description: The Flutter revision used to create the release.
        flutter_version:
          type: string
          description: |
            The Flutter version used to create the release. Optional
            because it was added later; older releases do not have it.
        display_name:
          type: string
          description: The display name for the release.
        platform_statuses:
          type: object
          deprecated: true
          description: |
            The status of the release for each platform. Deprecated: read
            `platforms`, which carries the same statuses with each platform's
            signing. Still sent, for CLIs that predate `platforms`.
          additionalProperties:
            $ref: '#/components/schemas/ReleaseStatus'
          propertyNames:
            $ref: '#/components/schemas/ReleasePlatform'
        platforms:
          type: object
          description: |
            The release on each platform it has been released to: that
            platform's status and signing.
          additionalProperties:
            $ref: '#/components/schemas/ReleasePlatformDetails'
          propertyNames:
            $ref: '#/components/schemas/ReleasePlatform'
        created_at:
          type: string
          format: date-time
          description: The date and time the release was created.
        updated_at:
          type: string
          format: date-time
          description: The date and time the release was last updated.
        notes:
          type: string
          description: Freeform notes associated with the release, if any.
    ReleasePlatformDetails:
      type: object
      description: A release on one platform.
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/ReleaseStatus'
        signing_mode:
          type: string
          description: |
            How the platform's binaries are signed, one of the
            ReleaseSigningMode values: managed, customer or unsigned. A
            string rather than the enum so that a client meeting a mode
            added after it was built reads it as unknown instead of failing
            to read the release. Absent when the binaries were uploaded by a
            CLI from before signing was reported.
    ReleaseAnalysis:
      type: object
      description: |
        Analyzer-extracted metadata for a release artifact on a single
        platform.
      required:
        - display_name
        - package_name
        - min_sdk_version
        - target_sdk_version
        - architectures
      properties:
        display_name:
          type: string
          description: |
            The user-visible application name extracted from the artifact
            (e.g. AndroidManifest `application:label`). May differ from
            the user-curated `App.display_name`.
        package_name:
          type: string
          description: The application package name (e.g. `com.example.app`).
        min_sdk_version:
          type: string
          description: |
            The minimum SDK level required to install the artifact
            (Android API level for android, iOS deployment target for ios).
        target_sdk_version:
          type: string
          description: |
            The SDK level the artifact targets (Android targetSdk for
            android, iOS SDK for ios).
        architectures:
          type: array
          description: |
            CPU architectures present in the artifact
            (e.g. `["arm64-v8a", "armeabi-v7a"]`).
          items:
            type: string
    LatestRelease:
      type: object
      description: |
        Per-platform projection of an analyzed release as surfaced by
        `AppMetadata.latest_releases`. Each entry corresponds to the
        most recent analyzed release on the keying platform, so
        `analysis` is always populated and `status` is the single
        per-platform status (rather than the cross-platform
        `platform_statuses` map carried by `Release`).
      required:
        - id
        - version
        - flutter_revision
        - created_at
        - updated_at
        - status
        - analysis
      properties:
        id:
          type: integer
          format: int64
          description: The ID of the release.
        version:
          type: string
          description: The version of the release.
        flutter_revision:
          type: string
          description: The Flutter revision used to create the release.
        flutter_version:
          type: string
          description: |
            The Flutter version used to create the release. Optional
            because it was added later; older releases do not have it.
        created_at:
          type: string
          format: date-time
          description: The date and time the release was created.
        updated_at:
          type: string
          format: date-time
          description: The date and time the release was last updated.
        status:
          $ref: '#/components/schemas/ReleaseStatus'
          description: The release's status on the keying platform.
        notes:
          type: string
          description: Freeform notes associated with the release, if any.
        analysis:
          $ref: '#/components/schemas/ReleaseAnalysis'
          description: |
            Analyzer-extracted metadata for this release on the keying
            platform. Always present (entries without analysis are
            omitted from `latest_releases`).
    PendingRelease:
      type: object
      description: |
        A newer release that has been created but not yet analyzed.
        Surfaced alongside the most recent analyzed release so clients
        can show an "analyzing…" indicator without losing the stable
        icon and metadata.
      required:
        - id
        - version
        - created_at
      properties:
        id:
          type: integer
          format: int64
          description: The ID of the pending release.
        version:
          type: string
          description: The version of the pending release.
        created_at:
          type: string
          format: date-time
          description: The date and time the pending release was created.
    ReleaseArtifact:
      type: object
      description: |
        An artifact contains metadata about the contents of a specific
        release for a specific platform and architecture.
      required:
        - id
        - release_id
        - arch
        - platform
        - hash
        - size
        - url
        - can_sideload
      properties:
        id:
          type: integer
          format: int64
          description: The ID of the artifact.
        release_id:
          type: integer
          format: int64
          description: The ID of the release.
        arch:
          type: string
          description: The arch of the artifact.
        platform:
          $ref: '#/components/schemas/ReleasePlatform'
          description: The platform of the artifact.
        hash:
          type: string
          description: The hash of the artifact.
        size:
          type: integer
          format: int64
          description: The size of the artifact in bytes.
        url:
          type: string
          description: The url of the artifact.
        podfile_lock_hash:
          type: string
          description: sha256 of the Podfile.lock used to create the artifact (iOS only).
        can_sideload:
          type: boolean
          description: Whether the artifact can be sideloaded onto a device.
        signing:
          $ref: '#/components/schemas/ArtifactSigning'
          description: |
            How the artifact's binary is signed. Absent for an artifact
            uploaded before the CLI reported it, which is unsigned or signed
            with a key the server never saw.
    Patch:
      type: object
      description: |
        An over-the-air update which is applied to a specific release.
        All patches have a patch number (auto-incrementing integer) and
        multiple patches can be published for a given release.
      required:
        - id
        - number
      properties:
        id:
          type: integer
          format: int64
          description: The unique patch identifier.
        number:
          type: integer
          format: int64
          description: The patch number. A larger number equates to a newer patch.
        notes:
          type: string
          description: Freeform notes associated with the patch, if any.
    PatchArtifact:
      type: object
      description: |
        Metadata about the contents of a specific patch for a specific
        platform and architecture.
      required:
        - id
        - patch_id
        - arch
        - platform
        - hash
        - size
        - created_at
      properties:
        id:
          type: integer
          format: int64
          description: The ID of the artifact.
        patch_id:
          type: integer
          format: int64
          description: The ID of the patch.
        arch:
          type: string
          description: The arch of the artifact.
        platform:
          $ref: '#/components/schemas/ReleasePlatform'
          description: The platform of the artifact.
        hash:
          type: string
          description: The hash of the artifact.
        size:
          type: integer
          format: int64
          description: The size of the artifact in bytes.
        created_at:
          type: string
          format: date-time
          description: The date and time the artifact was created.
    ReleasePatch:
      type: object
      description: A patch for a given release.
      required:
        - id
        - number
        - artifacts
        - is_rolled_back
      properties:
        id:
          type: integer
          format: int64
          description: The patch id.
        number:
          type: integer
          format: int64
          description: The patch number.
        channel:
          type: string
          description: The channel associated with the patch.
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/PatchArtifact'
          description: The associated patch artifacts.
        is_rolled_back:
          type: boolean
          description: Whether the patch has been rolled back.
        created_at:
          type: string
          format: date-time
          description: |
            The date and time the patch was created. Optional because it was
            added later; older servers do not send it.
        notes:
          type: string
          description: Freeform notes associated with the patch, if any.
    ReleasePlatform:
      type: string
      description: A platform to which a Shorebird release can be deployed.
      enum:
        - android
        - ios
        - linux
        - macos
        - windows
      x-enum-descriptions:
        - Android.
        - iOS.
        - Linux.
        - macOS.
        - Windows.
    ReleaseSigningMode:
      type: string
      description: How a release artifact's binary is signed for patch signing.
      enum:
        - managed
        - customer
        - unsigned
      x-enum-descriptions:
        - The binary embeds a key Shorebird holds, which signs every patch to it.
        - The binary embeds a key the customer holds, who signs every patch.
        - The binary embeds no key, so its patches are not signed.
    ArtifactSigning:
      type: object
      description: |
        How a release artifact's binary is signed for patch signing: which
        public key the binary embeds. Patches to that release, platform and
        arch are verified with it.
      required:
        - mode
      properties:
        mode:
          type: string
          description: |
            One of the ReleaseSigningMode values: managed, customer or
            unsigned. A string rather than the enum so that a client meeting
            a mode added after it was built reads it as unknown instead of
            failing to read the artifact.
        key_id:
          type: integer
          format: int64
          description: |
            The managed key the binary embeds. Present exactly when mode is
            managed.
        public_key_pem:
          type: string
          description: |
            The managed key's public key the binary embeds, PEM encoded
            (SubjectPublicKeyInfo), which `shorebird patch` builds against.
            Present exactly when mode is managed: the server doesn't store
            customers' keys.
    ArtifactSigningRequest:
      type: object
      description: |
        How the CLI signed a release artifact's binary. A managed binary
        names the key GET /apps/{appId}/signing-key returned (key_id). A
        customer-signed or unsigned binary sends only its mode.
      required:
        - mode
      properties:
        mode:
          $ref: '#/components/schemas/ReleaseSigningMode'
        key_id:
          type: integer
          format: int64
          description: |
            The managed key the binary embeds. Required when mode is
            managed, and refused otherwise.
    SigningKey:
      type: object
      description: |
        A managed patch-signing key: a key Shorebird holds, whose private
        half never leaves Cloud KMS, and which signs the patches of every
        release that embeds it.
      required:
        - id
        - public_key_pem
      properties:
        id:
          type: integer
          format: int64
          description: The key's id, which a managed release artifact names as signing.key_id.
        public_key_pem:
          type: string
          description: |
            The public key, PEM encoded (SubjectPublicKeyInfo), which a
            release build embeds to verify its patches.
    GetSigningKeyResponse:
      type: object
      description: |
        The response body for GET /apps/{appId}/signing-key.
      required:
        - signing_key
      properties:
        signing_key:
          $ref: '#/components/schemas/SigningKey'
    ReleaseStatus:
      type: string
      description: The status of a release.
      enum:
        - draft
        - active
      x-enum-descriptions:
        - The release has been created, but not all platform artifacts have been uploaded.
        - All platform artifacts have been uploaded for this release.
    Role:
      type: string
      description: A role that a user can have relative to an Organization or App.
      enum:
        - owner
        - admin
        - appManager
        - developer
        - viewer
        - auditor
        - none
      x-enum-descriptions:
        - User that created the organization.
        - Users who have permissions to manage the organization.
        - Users who have permissions to manage an app.
        - Users who are part of the organization but have limited permissions.
        - Users who have read-only access to the organization.
        - Accounts that can read the organization's audit log and nothing else.
        - Users who are not part of the organization but have visibility into it via app collaborator permissions.
    AppCollaboratorRole:
      type: string
      description: A role a user can have on a specific app.
      enum:
        - admin
        - developer
      x-enum-descriptions:
        - A user with this role can perform all available actions on apps, releases, patches, channels, and collaborators.
        - A user with this role can manage releases and patches, but cannot manage collaborators or the application itself.
    AuthProvider:
      type: string
      description: The authentication provider used to sign in the user.
      enum:
        - google
        - microsoft
        - shorebird
      x-enum-descriptions:
        - Signed in via Google.
        - Signed in via Microsoft.
        - Signed in via a Shorebird-managed account.
    OrganizationType:
      type: string
      description: |
        Distinguishes the personal organization created with each user
        account from team organizations.
      enum:
        - personal
        - team
      x-enum-descriptions:
        - The organization implicitly created with each user account. Its owner can invite members.
        - A multi-user organization with collaborators.
    Organization:
      type: object
      description: |
        An organization groups users and apps together. Organizations
