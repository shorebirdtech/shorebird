    PublicUser:
      type: object
      description: |
        A Shorebird user with non-sensitive information only.
      required:
        - id
        - email
      properties:
        id:
          type: integer
          format: int64
          description: The user's unique identifier.
        email:
          type: string
          format: email
          description: The user's email address.
        display_name:
          type: string
          description: The user's name.
    PrivateUser:
      type: object
      description: |
        A fully-detailed user object, possibly including sensitive
