name: shorebird_code_push_protocol
description: Library which contains common interfaces used by Shorebird CodePush
version: 0.1.0+1
repository: https://github.com/shorebirdtech/shorebird
resolution: workspace

publish_to: none

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  collection: ^1.19.1
  meta: ^1.19.0

dev_dependencies:
  mocktail: ^1.0.5
  # Only used by `tool/gen.dart` to regenerate lib/src/ from the OpenAPI
  # spec. gen.dart lists the directories space_gen clears before each run
  # (`generatedDirs`, which space_gen supports from 1.5.0).
  space_gen: ^1.6.0
  test: ^1.33.0
