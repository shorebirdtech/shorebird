include: ../../analysis_options.yaml
# Most of lib/ is generated by space_gen from openapi.yaml, which carries
# neither member docs nor deprecation messages. These three match the
# analysis_options.yaml space_gen writes for the packages it generates.
analyzer:
  exclude:
    - build/**
  errors:
    # Triggers even inside the deprecated member's own class.
    deprecated_member_use_from_same_package: ignore
linter:
  rules:
    public_member_api_docs: false
    provide_deprecation_message: false
